<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Domma</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo/domma-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="../dist/domma.css">
    <link rel="stylesheet" href="../dist/elements.css">
    <link rel="stylesheet" href="../dist/themes/domma-themes.css">
  <!-- App Custom Styles -->
  <link rel="stylesheet" href="./custom.css">
</head>
<body class="dm-cloaked dm-theme-charcoal-dark" data-layout="public">

<header class="page-header">
    <h1>Blog</h1>
    <p>News, tutorials, and insights about Domma and modern JavaScript development.</p>
</header>

<section class="blog-section">
    <!-- Loading state (replaced by cards once loaded) -->
    <div class="blog-grid" id="blog-grid">
        <div class="blog-loading">Loading articles...</div>
    </div>

    <div class="coming-soon" style="margin-top: 3rem;">
        <h3>More Articles Coming Soon</h3>
        <p>We're working on more tutorials, tips, and deep dives into Domma's features. Check back regularly for new content.</p>
    </div>
</section>

<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="../dist/domma.min.js"></script>
<script type="module" src="../layouts/js/layout.js"></script>
<script>
    // Blog post management
    (async function() {
        let posts = [];
        let currentPostIndex = 0;
        let slideover = null;

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Escape HTML for safe display
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render blog cards
        function renderCards(posts) {
            const grid = document.getElementById('blog-grid');

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="blog-loading">No articles found.</div>';
                return;
            }

            // Build cards with escaped content
            const cardsHtml = posts.map((post, index) => {
                const title = escapeHtml(post.title);
                const excerpt = escapeHtml(post.excerpt);
                const date = escapeHtml(formatDate(post.date));
                const readTime = escapeHtml(post.readTime);
                const icon = escapeHtml(post.icon || 'book-open');
                const tags = post.tags.map(tag => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join('');

                return `
                    <article class="blog-card" data-post-index="${index}" style="cursor: pointer;">
                        <div class="blog-card-image">
                            <span data-icon="${icon}" data-icon-size="48"></span>
                        </div>
                        <div class="blog-card-body">
                            <div class="blog-card-meta">
                                <span>${date}</span>
                                <span>${readTime}</span>
                            </div>
                            <h2 class="blog-card-title"><a href="#" onclick="return false;">${title}</a></h2>
                            <p class="blog-card-excerpt">${excerpt}</p>
                            <div class="blog-card-tags">
                                ${tags}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            grid.innerHTML = cardsHtml;

            // Scan for icons after rendering
            Domma.icons.scan();

            // Add click handlers
            document.querySelectorAll('.blog-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const index = parseInt(card.dataset.postIndex);
                    openPost(index);
                });
            });
        }

        // Build slideover content as DOM element
        function buildPostContent(post, index) {
            const container = document.createElement('div');

            // Header
            const header = document.createElement('div');
            header.className = 'post-reader-header';

            const dateSpan = document.createElement('span');
            dateSpan.className = 'post-reader-date';
            dateSpan.textContent = `${formatDate(post.date)} · ${post.readTime}`;

            const title = document.createElement('h1');
            title.className = 'post-reader-title';
            title.textContent = post.title;

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'post-reader-tags';
            post.tags.forEach(tag => {
                const tagSpan = document.createElement('span');
                tagSpan.className = 'blog-tag';
                tagSpan.textContent = tag;
                tagsDiv.appendChild(tagSpan);
            });

            header.appendChild(dateSpan);
            header.appendChild(title);
            header.appendChild(tagsDiv);

            // Content
            const content = document.createElement('article');
            content.className = 'post-reader-content';
            content.innerHTML = DOMPurify.sanitize(post.content);

            // Navigation
            const nav = document.createElement('nav');
            nav.className = 'post-reader-nav';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'post-nav-btn';
            prevBtn.setAttribute('data-nav', 'prev');
            prevBtn.textContent = '← Previous';
            if (index === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.onclick = () => openPost(index - 1);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'post-nav-btn';
            nextBtn.setAttribute('data-nav', 'next');
            nextBtn.textContent = 'Next →';
            if (index === posts.length - 1) {
                nextBtn.disabled = true;
            } else {
                nextBtn.onclick = () => openPost(index + 1);
            }

            nav.appendChild(prevBtn);
            nav.appendChild(nextBtn);

            // Assemble
            container.appendChild(header);
            container.appendChild(content);
            container.appendChild(nav);

            return container;
        }

        // Open post in slideover
        function openPost(index) {
            currentPostIndex = index;
            const post = posts[index];

            const content = buildPostContent(post, index);

            if (!slideover) {
                // Create slideover on first use
                slideover = Domma.elements.slideover({
                    position: 'right',
                    size: 'lg',
                    content: content,
                    backdrop: true,
                    backdropClose: true,
                    keyboard: true
                });
            } else {
                // Update existing slideover
                slideover.setContent(content);
            }

            slideover.open();
        }

        // Fetch posts from API
        try {
            const API_URL = 'http://localhost:3000/api/posts';
            const response = await Domma.http.get(API_URL);

            if (response.success && response.data) {
                posts = response.data;
                renderCards(posts);
            } else {
                document.getElementById('blog-grid').innerHTML = '<div class="blog-loading">Failed to load articles.</div>';
            }
        } catch (error) {
            console.error('Failed to fetch blog posts:', error);
            document.getElementById('blog-grid').innerHTML = '<div class="blog-loading">Unable to connect to the server. Please try again later.</div>';
        }
    })();

    // Scan for icons
    Domma.icons.scan();
</script>
</body>
</html>
