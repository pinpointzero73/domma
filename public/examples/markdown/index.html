<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor - Domma Examples</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/logo/domma-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="../../dist/domma.css">
    <link rel="stylesheet" href="../../dist/grid.css">
    <link rel="stylesheet" href="../../dist/elements.css">
    <link rel="stylesheet" href="../../dist/themes/domma-themes.css">
  <!-- App Custom Styles -->
  <link rel="stylesheet" href="./custom.css">
</head>
<body class="dm-cloaked dm-theme-charcoal-dark" data-layout="showcase" data-layout-variant="subpage">

<div class="hero hero-center bg-ambient-float-blobs">
    <div class="hero-content">
        <div class="hero-title">Markdown Editor</div>
        <div class="hero-subtitle">A real-time markdown editor with live preview, Storage persistence, and
            syntax helpers using Domma's Utils, Storage, and DOM manipulation.
        </div>
        <div class="hero-actions">
            <a href="component.js" download="domma-markdown-editor.js" class="btn btn-primary">
                <span data-icon="download" data-icon-size="18"></span>
                Download Component
            </a>
            <a href="template.html" download="domma-markdown-editor-template.html" class="btn btn-primary">
                <span data-icon="download" data-icon-size="18"></span>
                Download Template
            </a>
        </div>
        <p class="hero-note">Both files are required. Drop in <code>&lt;domma-markdown-editor&gt;&lt;/domma-markdown-editor&gt;</code> anywhere.</p>
    </div>
</div>

<div class="container">
    <!-- The component — replaces all the manual markup -->
    <domma-markdown-editor></domma-markdown-editor>
</div>

<!-- Scripts -->
<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="../../dist/domma.min.js"></script>
<script type="module" src="../../layouts/js/layout.js"></script>
<script src="component.js"></script>
</body>
</html>
