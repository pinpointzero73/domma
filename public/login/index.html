<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Domma</title>
    <link rel="canonical" href="https://dommajs.org/login/">
  <meta name="description" content="Sign in to your Domma account">

  <!-- Domma Core Styles -->
  <link rel="stylesheet" href="../dist/domma.css">
  <link rel="stylesheet" href="../dist/grid.css">
  <link rel="stylesheet" href="../dist/elements.css">
  <link rel="stylesheet" href="../dist/themes/domma-themes.css">

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="./custom.css">

</head>
<body class="dm-cloaked" data-layout="minimal" data-theme="default">

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <path d="M12 8 L12 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 8 L24 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 40 L24 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M24 8 L36 16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M36 16 L36 32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M36 32 L24 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"
                stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="3" fill="currentColor"/>
        </svg>
      </div>
      <h1>Welcome to Domma</h1>
      <p>Sign in to continue</p>
    </div>

    <!-- Auth Tabs -->
    <div id="authTabs">
      <button class="auth-tab-pill active" data-tab="login">Login</button>
      <button class="auth-tab-pill" data-tab="register">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginFormContainer"></div>

    <!-- Register Form -->
    <div id="registerFormContainer"></div>

    <div class="login-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>


<!-- Domma Core (load synchronously before layout) -->
<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="../dist/domma.min.js?v=4"></script>

<!-- Layout System -->
<script type="module" src="../layouts/js/layout.js"></script>

<script>
  // Ensure Domma is loaded
  if (typeof Domma === 'undefined' || typeof $ === 'undefined') {
    console.error('Domma not loaded!');
    const errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'padding: 2rem; text-align: center;';
    const h2 = document.createElement('h2');
    h2.textContent = 'Error: Domma framework not loaded';
    const p = document.createElement('p');
    p.textContent = 'Please refresh the page.';
    errorDiv.appendChild(h2);
    errorDiv.appendChild(p);
    document.body.textContent = '';
    document.body.appendChild(errorDiv);
  } else {
    $(() => {
      try {
        console.log('[Login] Starting initialization...');

        // Initialize auth module
        console.log('[Login] Initializing auth module...');
        Domma.auth.init({
          apiUrl: `http://${window.location.hostname}:3000/api`
        });

        // Check if already logged in
        if (Domma.auth.isAuthenticated()) {
          console.log('[Login] User already authenticated, redirecting...');
          window.location.href = Domma.auth.isAdmin() ? '../admin/' : '../miniapps/address/';
          return;
        }

        // Tabs already exist in HTML - just bind event handlers
        console.log('[Login] Setting up tab event handlers...');
        $('#authTabs .auth-tab-pill').on('click', function () {
          const tab = $(this).attr('data-tab');
          console.log('[Login] Tab clicked:', tab);

          // Update active state
          $('#authTabs .auth-tab-pill').removeClass('active');
          $(this).addClass('active');

          // Show/hide forms
          if (tab === 'login') {
            $('#loginFormContainer').css('display', 'block');
            $('#registerFormContainer').css('display', 'none');
          } else {
            $('#loginFormContainer').css('display', 'none');
            $('#registerFormContainer').css('display', 'block');
          }
        });

        // Create login form
        console.log('[Login] Creating login form...');
        try {
          Domma.auth.createLoginForm('#loginFormContainer', {
            showLabels: true,
            onSuccess: () => {
              window.location.href = Domma.auth.isAdmin() ? '../admin/' : '../miniapps/address/';
            },
            onError: (error) => {
              Domma.elements.toast(error.message || 'Login failed', {type: 'error'});
            }
          });
        } catch (e) {
          console.error('[Login] Failed to create login form:', e);
          Domma.elements.toast('Failed to initialise login form', {type: 'error'});
        }

        // Create register form
        console.log('[Login] Creating register form...');
        try {
          Domma.auth.createRegisterForm('#registerFormContainer', {
            showLabels: true,
            onSuccess: () => {
              window.location.href = Domma.auth.isAdmin() ? '../admin/' : '../miniapps/address/';
            },
            onError: (error) => {
              Domma.elements.toast(error.message || 'Registration failed', {type: 'error'});
            }
          });
        } catch (e) {
          console.error('[Login] Failed to create register form:', e);
          Domma.elements.toast('Failed to initialise registration form', {type: 'error'});
        }

        // Set initial visibility using CSS (show login, hide register)
        console.log('[Login] Setting initial form visibility...');
        $('#loginFormContainer').css('display', 'block');
        $('#registerFormContainer').css('display', 'none');

        // Scan icons
        console.log('[Login] Scanning icons...');
        if (Domma.icons) {
          Domma.icons.scan();
        }

        console.log('[Login] Initialization complete');
      } catch (error) {
        console.error('[Login] Initialization failed:', error);
        if (Domma.elements && Domma.elements.toast) {
          Domma.elements.toast('Initialization failed. Please refresh the page.', {type: 'error'});
        }
      }
    });
  }
</script>

</body>
</html>
