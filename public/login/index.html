<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Domma</title>
  <meta name="description" content="Sign in to your Domma account">

  <!-- Domma Core Styles -->
  <link rel="stylesheet" href="../dist/domma.css">
  <link rel="stylesheet" href="../dist/grid.css">
  <link rel="stylesheet" href="../dist/elements.css">
  <link rel="stylesheet" href="../dist/themes/domma-themes.css">

  <style>
      body {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, var(--dm-primary) 0%, var(--dm-primary-dark) 100%);
      }

      .login-container {
          width: 100%;
          max-width: 450px;
          padding: 2rem;
      }

      .login-card {
          background: white;
          border-radius: 16px;
          padding: 3rem;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .login-header {
          text-align: center;
          margin-bottom: 2rem;
      }

      .login-logo {
          margin-bottom: 1rem;
          color: var(--dm-primary);
      }

      .login-header h1 {
          margin: 0 0 0.5rem;
          font-size: 1.75rem;
          color: #1f2937;
      }

      .login-header p {
          margin: 0;
          color: #6b7280;
      }

      #authTabs {
          margin-bottom: 2rem;
          display: flex;
          justify-content: center;
          gap: 1rem;
      }

      .auth-tab-pill {
          padding: 0.75rem 2rem;
          border-radius: 50px;
          border: 2px solid var(--dm-primary-t30);
          background: transparent;
          color: var(--dm-primary);
          font-weight: 500;
          cursor: pointer;
          transition: all 0.3s ease;
          font-size: 1rem;
      }

      .auth-tab-pill:hover {
          background: var(--dm-primary-t10);
          border-color: var(--dm-primary-t50);
      }

      .auth-tab-pill.active {
          background: var(--dm-primary);
          color: white;
          border-color: var(--dm-primary);
          box-shadow: 0 4px 12px var(--dm-primary-t30);
      }

      .login-footer {
          text-align: center;
          margin-top: 2rem;
          padding-top: 2rem;
          border-top: 1px solid #e5e7eb;
      }

      .login-footer a {
          color: var(--dm-primary);
          text-decoration: none;
          font-weight: 500;
      }

      .login-footer a:hover {
          text-decoration: underline;
      }

      @media (max-width: 576px) {
          .login-card {
              padding: 2rem 1.5rem;
          }

          .login-header h1 {
              font-size: 1.5rem;
          }
      }
  </style>

</head>
<body class="dm-cloaked" data-layout="minimal" data-theme="default">

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <path d="M12 8 L12 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 8 L24 8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 40 L24 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M24 8 L36 16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M36 16 L36 32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M36 32 L24 40" stroke="currentColor" stroke-width="4" stroke-linecap="round"
                stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="3" fill="currentColor"/>
        </svg>
      </div>
      <h1>Welcome to Domma</h1>
      <p>Sign in to continue</p>
    </div>

    <!-- Auth Tabs -->
    <div id="authTabs"></div>

    <!-- Login Form -->
    <div id="loginFormContainer"></div>

    <!-- Register Form -->
    <div id="registerFormContainer"></div>

    <div class="login-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</div>


<!-- Domma Core (load synchronously before layout) -->
<script src="../dist/domma.min.js?v=3"></script>

<!-- Layout System -->
<script type="module" src="../layouts/js/layout.js"></script>

<script>
  // Ensure Domma is loaded
  if (typeof Domma === 'undefined' || typeof $ === 'undefined') {
    console.error('Domma not loaded!');
    const errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'padding: 2rem; text-align: center;';
    const h2 = document.createElement('h2');
    h2.textContent = 'Error: Domma framework not loaded';
    const p = document.createElement('p');
    p.textContent = 'Please refresh the page.';
    errorDiv.appendChild(h2);
    errorDiv.appendChild(p);
    document.body.textContent = '';
    document.body.appendChild(errorDiv);
  } else {
    $(() => {
      // Initialize auth module
      // Use localhost API for local dev, relative path for production
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      Domma.auth.init({
        apiUrl: isLocal ? 'http://localhost:3000/api' : '/api'
      });

      // Check if already logged in
      if (Domma.auth.isAuthenticated()) {
        window.location.href = '../index.html';
        return;
      }

      // Create custom pill-style tabs
      const tabsHtml = `
      <button class="auth-tab-pill active" data-tab="login">Login</button>
      <button class="auth-tab-pill" data-tab="register">Register</button>
    `;
      $('#authTabs').html(tabsHtml);

      // Handle tab switching
      $('#authTabs .auth-tab-pill').on('click', function () {
        const tab = $(this).attr('data-tab');

        // Update active state
        $('#authTabs .auth-tab-pill').removeClass('active');
        $(this).addClass('active');

        // Show/hide forms
        if (tab === 'login') {
          $('#loginFormContainer').css('display', 'block');
          $('#registerFormContainer').css('display', 'none');
        } else {
          $('#loginFormContainer').css('display', 'none');
          $('#registerFormContainer').css('display', 'block');
        }
      });

      // Create login form
      Domma.auth.createLoginForm('#loginFormContainer', {
        showLabels: true,
        onSuccess: () => {
          window.location.href = '../index.html';
        },
        onError: (error) => {
          Domma.elements.toast(error.message || 'Login failed', {type: 'error'});
        }
      });

      // Create register form
      Domma.auth.createRegisterForm('#registerFormContainer', {
        showLabels: true,
        onSuccess: () => {
          window.location.href = '../index.html';
        },
        onError: (error) => {
          Domma.elements.toast(error.message || 'Registration failed', {type: 'error'});
        }
      });

      // Set initial visibility using CSS (show login, hide register)
      $('#loginFormContainer').css('display', 'block');
      $('#registerFormContainer').css('display', 'none');

      // Scan icons
      Domma.icons.scan();
    });
  }
</script>

</body>
</html>
