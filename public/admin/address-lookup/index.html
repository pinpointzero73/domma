<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Lookup Admin - Domma</title>
  <meta name="description" content="Address Lookup Service Administration">

  <!-- Domma Core Styles -->
  <link rel="stylesheet" href="../../dist/domma.css">
  <link rel="stylesheet" href="../../dist/grid.css">
  <link rel="stylesheet" href="../../dist/elements.css">
  <link rel="stylesheet" href="../../dist/themes/domma-themes.css">

  <!-- Admin Custom Styles -->
  <link rel="stylesheet" href="../index.css">
</head>
<body class="dm-cloaked" data-theme="default" data-layout="public">

<!-- Layout system will inject navbar here -->

<!-- Admin Layout Wrapper -->
<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Page Header -->
    <div class="admin-header">
      <h1>Address Lookup Service</h1>
      <p>Overview & Statistics</p>
    </div>

    <!-- Page Content -->
    <div class="admin-content">

  <!-- Statistics Cards Row -->
  <div class="grid grid-cols-5 gap-4 mb-6" id="stats-cards">
    <!-- Total Users Card -->
    <div class="card" data-collapsible="true">
      <div class="card-body">
        <h3 class="card-title text-sm text-gray-600 mb-2">Total Users</h3>
        <p class="text-3xl font-bold mb-2" id="stat-total-users">-</p>
        <p class="text-xs text-gray-500">Using address service</p>
      </div>
    </div>

    <!-- Total Lookups Card -->
    <div class="card" data-collapsible="true">
      <div class="card-body">
        <h3 class="card-title text-sm text-gray-600 mb-2">Total Lookups</h3>
        <p class="text-3xl font-bold mb-2" id="stat-total-lookups">-</p>
        <p class="text-xs text-gray-500">
          <span class="badge badge-primary" id="stat-free-lookups">0 free</span>
          <span class="badge badge-secondary" id="stat-premium-lookups">0 premium</span>
        </p>
      </div>
    </div>

    <!-- Credits Card -->
    <div class="card" data-collapsible="true">
      <div class="card-body">
        <h3 class="card-title text-sm text-gray-600 mb-2">Credits</h3>
        <p class="text-sm mb-2">
          <strong id="stat-credits-purchased">0</strong> Purchased<br>
          <strong id="stat-credits-consumed">0</strong> Consumed<br>
          <strong id="stat-credits-remaining">0</strong> Remaining
        </p>
      </div>
    </div>

    <!-- Cache Stats Card -->
    <div class="card" data-collapsible="true">
      <div class="card-body">
        <h3 class="card-title text-sm text-gray-600 mb-2">Cache Performance</h3>
        <p class="text-3xl font-bold mb-2" id="stat-cache-hit-rate">-</p>
        <p class="text-xs text-gray-500">
          <span class="badge badge-success" id="stat-cache-hits">0 hits</span>
          <span class="badge badge-danger" id="stat-cache-misses">0 misses</span>
        </p>
      </div>
    </div>

    <!-- Active API Keys Card -->
    <div class="card" data-collapsible="true">
      <div class="card-body">
        <h3 class="card-title text-sm text-gray-600 mb-2">Active API Keys</h3>
        <p class="text-3xl font-bold mb-2" id="stat-active-keys">-</p>
        <p class="text-xs text-gray-500">Across all users</p>
      </div>
    </div>
  </div>

  <!-- Recent Activity Table -->
  <div class="card mb-6" data-collapsible="true">
    <div class="card-header">
      <h2 class="card-title">Recent Activity</h2>
    </div>
    <div class="card-body">
      <table id="activity-table" class="table"></table>
    </div>
  </div>

    </div>
  </main>
</div>

<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<!-- Domma Framework -->
<script src="../../dist/domma.min.js"></script>

<!-- Layout System (injects navbar) -->
<script type="module" src="../../layouts/js/layout.js"></script>

<!-- Admin Page Logic -->
<script type="module" src="index.js"></script>
</body>
</html>
