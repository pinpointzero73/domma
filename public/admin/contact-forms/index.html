<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Forms Dashboard - Admin - Domma</title>
  <meta name="description" content="Manage contact form submissions">

  <!-- Domma Core Styles -->
  <link rel="stylesheet" href="../../dist/domma.css">
  <link rel="stylesheet" href="../../dist/grid.css">
  <link rel="stylesheet" href="../../dist/elements.css">
  <link rel="stylesheet" href="../../dist/themes/domma-themes.css">

  <!-- Admin Custom Styles -->
  <link rel="stylesheet" href="../index.css">
</head>
<body class="dm-cloaked" data-theme="default">

<!-- Admin Layout Wrapper -->
<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Page Header -->
    <div class="admin-header">
      <h1>Contact Forms Dashboard</h1>
      <p>Manage contact form submissions and email communications</p>
    </div>

    <!-- Page Content -->
    <div class="admin-content">

      <!-- Statistics Cards Row -->
      <div class="grid grid-cols-4 gap-4 mb-6" id="stats-cards">
        <!-- Total Emails Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Email Communications</h3>
            <p class="text-3xl font-bold mb-2" id="stat-total-emails">-</p>
            <p class="text-xs text-gray-500">
              <span class="badge badge-success" id="stat-sent-emails">0 sent</span>
              <span class="badge badge-danger" id="stat-failed-emails">0 failed</span>
            </p>
          </div>
        </div>

        <!-- Contact Forms Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Contact Forms</h3>
            <p class="text-3xl font-bold mb-2" id="stat-contact-emails">-</p>
            <p class="text-xs text-gray-500">Form submissions</p>
          </div>
        </div>

        <!-- Pending Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Pending</h3>
            <p class="text-3xl font-bold mb-2" id="stat-pending-emails">-</p>
            <p class="text-xs text-gray-500">Awaiting processing</p>
          </div>
        </div>

        <!-- Status Overview Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Status Overview</h3>
            <p class="text-sm mb-2" id="stat-status-summary">-</p>
          </div>
        </div>
      </div>

      <!-- Contact Emails Table -->
      <div class="card" data-collapsible="true">
        <div class="card-header">
          <h2 class="card-title">Contact Form Submissions</h2>
        </div>
        <div class="card-body">
          <!-- Search and Filters -->
          <div class="grid grid-cols-12 gap-4 mb-4">
            <div class="col-span-4">
              <input type="text" id="email-search" class="form-input" placeholder="Search by name, email, or company...">
            </div>
            <div class="col-span-2">
              <select id="email-status-filter" class="form-input">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="sent">Sent</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="col-span-2">
              <select id="email-type-filter" class="form-input">
                <option value="">All Types</option>
                <option value="contact">Contact Forms</option>
                <option value="notification">Notifications</option>
                <option value="newsletter">Newsletter</option>
              </select>
            </div>
            <div class="col-span-2">
              <input type="date" id="email-date-filter" class="form-input" title="Filter by date">
            </div>
            <div class="col-span-2">
              <button id="refresh-emails" class="btn btn-primary btn-block">Refresh</button>
            </div>
          </div>

          <!-- Emails Table -->
          <table id="emails-table" class="table"></table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Domma Framework -->
<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="../../dist/domma.min.js"></script>
<!-- Admin Page Logic -->
<script type="module" src="index.js"></script>
</body>
</html>
