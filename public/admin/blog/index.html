<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts - Admin - Domma</title>
  <meta name="description" content="Manage blog posts and articles">

  <!-- Domma Core Styles -->
  <link rel="stylesheet" href="../../dist/domma.css">
  <link rel="stylesheet" href="../../dist/grid.css">
  <link rel="stylesheet" href="../../dist/elements.css">
  <link rel="stylesheet" href="../../dist/themes/domma-themes.css">

  <!-- Admin Custom Styles -->
  <link rel="stylesheet" href="../index.css">

  <style>
    /* Status badge colours */
    .badge-draft { background-color: #fbbf24; color: #78350f; }
    .badge-published { background-color: #34d399; color: #064e3b; }
    .badge-archived { background-color: #9ca3af; color: #1f2937; }

    /* Table action buttons */
    .btn-table-action {
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      margin-right: 0.25rem;
    }

    /* Quick actions column */
    .actions-cell {
      white-space: nowrap;
    }
  </style>
</head>
<body class="dm-cloaked" data-theme="default">

<!-- Admin Layout Wrapper -->
<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside id="admin-sidebar" class="admin-sidebar"></aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Page Header -->
    <div class="admin-header">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1>Blog Posts</h1>
          <p>Manage blog articles and content</p>
        </div>
        <div>
          <a href="edit.html" class="btn btn-primary">
            <span data-icon="plus" data-icon-size="16" style="margin-right: 0.5rem;"></span>
            New Post
          </a>
        </div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="admin-content">

      <!-- Statistics Cards Row -->
      <div class="grid grid-cols-4 gap-4 mb-6" id="stats-cards">
        <!-- Total Posts Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Total Posts</h3>
            <p class="text-3xl font-bold mb-2" id="stat-total">-</p>
            <p class="text-xs text-gray-500">All time articles</p>
          </div>
        </div>

        <!-- Published Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Published</h3>
            <p class="text-3xl font-bold mb-2" id="stat-published">-</p>
            <p class="text-xs text-gray-500">Live articles</p>
          </div>
        </div>

        <!-- Drafts Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Drafts</h3>
            <p class="text-3xl font-bold mb-2" id="stat-drafts">-</p>
            <p class="text-xs text-gray-500">Unpublished posts</p>
          </div>
        </div>

        <!-- Archived Card -->
        <div class="card" data-collapsible="true">
          <div class="card-body">
            <h3 class="card-title text-sm text-gray-600 mb-2">Archived</h3>
            <p class="text-3xl font-bold mb-2" id="stat-archived">-</p>
            <p class="text-xs text-gray-500">Archived articles</p>
          </div>
        </div>
      </div>

      <!-- Posts Table -->
      <div class="card mb-6" data-collapsible="true">
        <div class="card-header">
          <h2 class="card-title">All Posts</h2>
        </div>
        <div class="card-body">
          <!-- Search and Filters -->
          <div class="grid grid-cols-12 gap-4 mb-4">
            <div class="col-span-6">
              <input type="text" id="post-search" class="form-input" placeholder="Search by title...">
            </div>
            <div class="col-span-3">
              <select id="status-filter" class="form-input">
                <option value="">All Status</option>
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div class="col-span-3">
              <button id="refresh-posts" class="btn btn-primary btn-block">Refresh</button>
            </div>
          </div>

          <!-- Posts Table -->
          <table id="posts-table" class="table"></table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Domma Framework -->
<!-- DOMPurify for XSS protection -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="../../dist/domma.min.js"></script>
<!-- Layout System -->
<script type="module" src="../../layouts/js/layout.js"></script>
<!-- Admin Page Logic -->
<script type="module" src="index.js"></script>
</body>
</html>
