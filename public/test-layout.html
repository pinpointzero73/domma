<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="stylesheet" href="showcase/css/domma.css">
</head>
<body class="dm-theme-light">

<main class="container py-8">
    <h1>Layout Test Page</h1>
    <p>If you can see the navigation bar, theme toggle, and this text, Domma is working.</p>
    <div id="status"></div>
</main>

<script src="dist/domma.min.js"></script>
<script src="showcase/js/layout.js"></script>
<script>
    const status = document.getElementById('status');

    // Check if Domma loaded
    if (typeof Domma !== 'undefined') {
        status.innerHTML += '<p style="color: green;">✓ Domma loaded successfully</p>';

        // Check if elements namespace exists
        if (Domma.elements) {
            status.innerHTML += '<p style="color: green;">✓ Domma.elements exists</p>';

            // Check if new components exist
            if (Domma.elements.autocomplete) {
                status.innerHTML += '<p style="color: green;">✓ Autocomplete component exists</p>';
            } else {
                status.innerHTML += '<p style="color: red;">✗ Autocomplete component missing</p>';
            }

            if (Domma.elements.pillbox) {
                status.innerHTML += '<p style="color: green;">✓ Pillbox component exists</p>';
            } else {
                status.innerHTML += '<p style="color: red;">✗ Pillbox component missing</p>';
            }
        } else {
            status.innerHTML += '<p style="color: red;">✗ Domma.elements missing</p>';
        }
    } else {
        status.innerHTML += '<p style="color: red;">✗ Domma failed to load</p>';
    }

    // Check if navbar was created by layout.js
    setTimeout(() => {
        const navbar = document.getElementById('main-navbar');
        if (navbar) {
            status.innerHTML += '<p style="color: green;">✓ Navbar created by layout.js</p>';
        } else {
            status.innerHTML += '<p style="color: red;">✗ Navbar not created - layout.js may have failed</p>';
        }

        // Additional debugging
        status.innerHTML += '<hr><h3>Debug Info:</h3>';
        status.innerHTML += `<p>$ function exists: ${typeof $ !== 'undefined' ? 'Yes' : 'No'}</p>`;
        status.innerHTML += `<p>_ function exists: ${typeof _ !== 'undefined' ? 'Yes' : 'No'}</p>`;
        status.innerHTML += `<p>Domma.elements.navbar exists: ${Domma.elements && Domma.elements.navbar ? 'Yes' : 'No'}</p>`;
        status.innerHTML += `<p>Current path: ${window.location.pathname}</p>`;
        status.innerHTML += `<p>Body classes: ${document.body.className}</p>`;

        // Check if theme toggle exists
        const themeToggle = document.getElementById('theme-toggle');
        status.innerHTML += `<p>Theme toggle exists: ${themeToggle ? 'Yes' : 'No'}</p>`;

        // Check if variant selector exists
        const variantSelector = document.getElementById('variant-selector');
        status.innerHTML += `<p>Variant selector exists: ${variantSelector ? 'Yes' : 'No'}</p>`;
    }, 500);
</script>

</body>
</html>
