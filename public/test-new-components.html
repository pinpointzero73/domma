<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: DesktopNotification, Timer & Alarm Components</title>
    <link rel="stylesheet" href="showcase/css/domma.css">
    <link rel="stylesheet" href="dist/themes/domma-themes.css">
    <style>
        body {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-section {
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--dm-surface);
            border-radius: 8px;
            border: 1px solid var(--dm-border);
        }

        .test-section h2 {
            margin-top: 0;
            color: var(--dm-primary);
        }

        .test-item {
            margin: 1rem 0;
            padding: 1rem;
            background: white;
            border-radius: 6px;
            border: 1px solid var(--dm-border);
        }

        .success {
            color: var(--dm-success);
            font-weight: bold;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--dm-border);
            border-radius: 4px;
            background: var(--dm-primary);
            color: white;
            cursor: pointer;
            margin: 0.25rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #timer-display {
            min-height: 100px;
        }

        #alarm-list {
            margin-top: 1rem;
        }

        .alarm-item {
            padding: 0.5rem;
            margin: 0.5rem 0;
            background: #f9f9f9;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body class="dm-theme-light">

<h1>Test: New Domma Components</h1>
<p>Testing DesktopNotification, Timer, and Alarm components</p>

<!-- DesktopNotification Tests -->
<div class="test-section">
    <h2>1. DesktopNotification Component</h2>

    <div class="test-item">
        <h3>Basic Notification</h3>
        <button class="btn" id="test-notify">Show Notification</button>
        <button class="btn" id="test-notify-persistent">Show Persistent Notification</button>
        <button class="btn" id="test-close-all">Close All Notifications</button>
        <p class="success" id="notification-status"></p>
    </div>

    <div class="test-item">
        <h3>Via Config Engine</h3>
        <button class="btn" id="config-notification-btn">Trigger Config Notification</button>
        <p class="success" id="config-notification-status"></p>
    </div>
</div>

<!-- Timer Tests -->
<div class="test-section">
    <h2>2. Timer Component</h2>

    <div class="test-item">
        <h3>Visual Timer (10 seconds)</h3>
        <div id="timer-display"></div>
        <p class="success" id="timer-status"></p>
    </div>

    <div class="test-item">
        <h3>Headless Timer</h3>
        <button class="btn" id="test-headless-start">Start 5s Headless Timer</button>
        <button class="btn" id="test-headless-pause">Pause</button>
        <button class="btn" id="test-headless-reset">Reset</button>
        <p>Remaining: <span id="headless-remaining">5000ms</span></p>
        <p class="success" id="headless-status"></p>
    </div>

    <div class="test-item">
        <h3>Via Config Engine</h3>
        <div id="config-timer"></div>
        <p class="success" id="config-timer-status"></p>
    </div>
</div>

<!-- Alarm Tests -->
<div class="test-section">
    <h2>3. Alarm Component</h2>

    <div class="test-item">
        <h3>Alarm Management</h3>
        <button class="btn" id="test-add-alarm">Add Test Alarm (1 minute from now)</button>
        <button class="btn" id="test-get-alarms">Get All Alarms</button>
        <button class="btn" id="test-clear-alarms">Clear All Alarms</button>
        <div id="alarm-list"></div>
        <p class="success" id="alarm-status"></p>
    </div>
</div>

<script src="dist/domma.min.js"></script>
<script>
    console.log('Testing new components...');

    // ===== DesktopNotification Tests =====

    // Test basic notification
    document.getElementById('test-notify').addEventListener('click', async () => {
        const notif = Domma.elements.notification({
            title: 'Test Notification',
            body: 'This is a test notification from Domma!',
            onClick: () => {
                console.log('Notification clicked!');
                document.getElementById('notification-status').textContent = '✓ Notification clicked';
            }
        });

        await notif.show();
        document.getElementById('notification-status').textContent = '✓ Notification shown';
    });

    // Test persistent notification
    document.getElementById('test-notify-persistent').addEventListener('click', async () => {
        Domma.elements.notify('Persistent Notification', {
            body: 'This notification requires interaction',
            requireInteraction: true
        });
    });

    // Test close all
    document.getElementById('test-close-all').addEventListener('click', () => {
        Domma.DesktopNotification.closeAll();
        document.getElementById('notification-status').textContent = '✓ All notifications closed';
    });

    // Test notification via config engine
    $.setup({
        '#config-notification-btn': {
            events: {
                click: (e) => {
                    Domma.elements.notify('Config Engine', {
                        body: 'Notification triggered via config engine!'
                    });
                    document.getElementById('config-notification-status').textContent = '✓ Config notification triggered';
                }
            }
        }
    });

    // ===== Timer Tests =====

    // Test visual timer
    const visualTimer = Domma.elements.timer('#timer-display', {
        duration: 10000,  // 10 seconds
        format: 'mm:ss',
        showControls: true,
        onComplete: () => {
            document.getElementById('timer-status').textContent = '✓ Visual timer completed!';
            Domma.elements.notify('Timer Complete', {
                body: 'Your 10-second timer has finished'
            });
        },
        onTick: (remaining) => {
            console.log('Timer remaining:', remaining);
        }
    });

    document.getElementById('timer-status').textContent = '✓ Visual timer initialized';

    // Test headless timer
    let headlessTimer = null;

    document.getElementById('test-headless-start').addEventListener('click', () => {
        if (!headlessTimer) {
            headlessTimer = Domma.elements.timer(null, {
                duration: 5000,  // 5 seconds
                onTick: (remaining) => {
                    document.getElementById('headless-remaining').textContent = remaining + 'ms';
                },
                onComplete: () => {
                    document.getElementById('headless-status').textContent = '✓ Headless timer completed!';
                }
            });
        }
        headlessTimer.start();
        document.getElementById('headless-status').textContent = '✓ Headless timer started';
    });

    document.getElementById('test-headless-pause').addEventListener('click', () => {
        if (headlessTimer) {
            headlessTimer.pause();
            document.getElementById('headless-status').textContent = '✓ Headless timer paused';
        }
    });

    document.getElementById('test-headless-reset').addEventListener('click', () => {
        if (headlessTimer) {
            headlessTimer.reset();
            document.getElementById('headless-remaining').textContent = '5000ms';
            document.getElementById('headless-status').textContent = '✓ Headless timer reset';
        }
    });

    // Test timer via config engine
    $.setup({
        '#config-timer': {
            component: 'timer',
            options: {
                duration: 15000,  // 15 seconds
                format: 'mm:ss',
                showControls: true,
                notification: true,
                onComplete: () => {
                    document.getElementById('config-timer-status').textContent = '✓ Config timer completed!';
                }
            }
        }
    });
    document.getElementById('config-timer-status').textContent = '✓ Config timer initialized';

    // ===== Alarm Tests =====

    const alarmManager = Domma.elements.alarm({
        onTrigger: (alarm) => {
            console.log('Alarm triggered:', alarm);
            document.getElementById('alarm-status').textContent = `✓ Alarm triggered: ${alarm.label}`;
        },
        onAlarmAdd: (alarm) => {
            console.log('Alarm added:', alarm);
            updateAlarmList();
        }
    });

    function updateAlarmList() {
        const alarms = alarmManager.getAlarms();
        const listDiv = document.getElementById('alarm-list');

        if (alarms.length === 0) {
            listDiv.innerHTML = '<p>No alarms set</p>';
        } else {
            listDiv.innerHTML = alarms.map(alarm => `
                <div class="alarm-item">
                    <span>${alarm.time} - ${alarm.label} (${alarm.enabled ? 'Enabled' : 'Disabled'})</span>
                    <button class="btn" onclick="removeAlarm('${alarm.id}')">Remove</button>
                </div>
            `).join('');
        }
    }

    window.removeAlarm = function (id) {
        alarmManager.remove(id);
        updateAlarmList();
        document.getElementById('alarm-status').textContent = '✓ Alarm removed';
    };

    document.getElementById('test-add-alarm').addEventListener('click', () => {
        // Add alarm for 1 minute from now
        const now = new Date();
        now.setMinutes(now.getMinutes() + 1);
        const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        alarmManager.add({
            time: timeString,
            label: 'Test Alarm (1 min)',
            repeat: null,  // One-time
            notification: true,
            sound: false
        });

        document.getElementById('alarm-status').textContent = `✓ Alarm added for ${timeString}`;
    });

    document.getElementById('test-get-alarms').addEventListener('click', () => {
        const alarms = alarmManager.getAlarms();
        console.log('All alarms:', alarms);
        updateAlarmList();
        document.getElementById('alarm-status').textContent = `✓ Found ${alarms.length} alarm(s)`;
    });

    document.getElementById('test-clear-alarms').addEventListener('click', () => {
        alarmManager.clearAll();
        updateAlarmList();
        document.getElementById('alarm-status').textContent = '✓ All alarms cleared';
    });

    // Initial load
    updateAlarmList();

    console.log('All tests initialized!');
    console.log('Components:', {
        notification: typeof Domma.elements.notification,
        notify: typeof Domma.elements.notify,
        timer: typeof Domma.elements.timer,
        alarm: typeof Domma.elements.alarm
    });
</script>

</body>
</html>
