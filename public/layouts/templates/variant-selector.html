<div class="variant-selector" id="variant-selector">
  <button class="variant-trigger" data-tooltip="Theme variants (16)"></button>
    <div class="variant-options">
      <!-- Ocean -->
      <button class="variant-dot variant-dot-ocean-light" data-theme="ocean-light"
              data-tooltip="Ocean Light ☀️"></button>
      <button class="variant-dot variant-dot-ocean-dark" data-theme="ocean-dark" data-tooltip="Ocean Dark 🌙"></button>

      <!-- Forest -->
      <button class="variant-dot variant-dot-forest-light" data-theme="forest-light"
              data-tooltip="Forest Light ☀️"></button>
      <button class="variant-dot variant-dot-forest-dark" data-theme="forest-dark"
              data-tooltip="Forest Dark 🌙"></button>

      <!-- Sunset -->
      <button class="variant-dot variant-dot-sunset-light" data-theme="sunset-light"
              data-tooltip="Sunset Light ☀️"></button>
      <button class="variant-dot variant-dot-sunset-dark" data-theme="sunset-dark"
              data-tooltip="Sunset Dark 🌙"></button>

      <!-- Royal -->
      <button class="variant-dot variant-dot-royal-light" data-theme="royal-light"
              data-tooltip="Royal Light ☀️"></button>
      <button class="variant-dot variant-dot-royal-dark" data-theme="royal-dark" data-tooltip="Royal Dark 🌙"></button>

      <!-- Lemon -->
      <button class="variant-dot variant-dot-lemon-light" data-theme="lemon-light"
              data-tooltip="Lemon Light ☀️"></button>
      <button class="variant-dot variant-dot-lemon-dark" data-theme="lemon-dark" data-tooltip="Lemon Dark 🌙"></button>

      <!-- Silver -->
      <button class="variant-dot variant-dot-silver-light" data-theme="silver-light"
              data-tooltip="Silver Light ☀️"></button>
      <button class="variant-dot variant-dot-silver-dark" data-theme="silver-dark"
              data-tooltip="Silver Dark 🌙"></button>

      <!-- Charcoal -->
      <button class="variant-dot variant-dot-charcoal-light" data-theme="charcoal-light"
              data-tooltip="Charcoal Light ☀️"></button>
      <button class="variant-dot variant-dot-charcoal-dark" data-theme="charcoal-dark"
              data-tooltip="Charcoal Dark 🌙"></button>

      <!-- Christmas -->
      <button class="variant-dot variant-dot-christmas-light" data-theme="christmas-light"
              data-tooltip="Christmas Light ☀️"></button>
      <button class="variant-dot variant-dot-christmas-dark" data-theme="christmas-dark"
              data-tooltip="Christmas Dark 🌙"></button>
    </div>
</div>
