<div class="snow-toggle-container">
  <button class="snow-toggle" id="snow-toggle" data-tooltip="Toggle snow effect">
    <svg id="snow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="2" x2="12" y2="22"></line>
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      <line x1="4.93" y1="7.07" x2="19.07" y2="16.93"></line>
      <line x1="19.07" y1="7.07" x2="4.93" y2="16.93"></line>
      <line x1="7.05" y1="4.05" x2="16.95" y2="19.95"></line>
      <line x1="16.95" y1="4.05" x2="7.05" y2="19.95"></line>
    </svg>
  </button>
  <div class="snow-slider" id="snow-slider">
    <button class="snow-intensity-btn" data-intensity="light">Light</button>
    <button class="snow-intensity-btn" data-intensity="medium">Medium</button>
    <button class="snow-intensity-btn" data-intensity="heavy">Heavy</button>
  </div>
</div>
