<!DOCTYPE html>
<html>
<head>
  <title>Test Slideover Component</title>
  <link rel="stylesheet" href="public/dist/domma.css">
  <link rel="stylesheet" href="public/dist/grid.css">
  <link rel="stylesheet" href="public/dist/elements.css">
  <style>
      body {
          padding: 20px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .test-card {
          margin-bottom: 20px;
          padding: 20px;
          border: 1px solid #ddd;
          border-radius: 8px;
      }

      .dm-slideover-header {
          padding: 20px;
          border-bottom: 1px solid #eee;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }

      .dm-slideover-title {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 600;
      }

      .dm-slideover-close {
          background: none;
          border: none;
          font-size: 24px;
          cursor: pointer;
          padding: 0;
          width: 32px;
          height: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .dm-slideover-close:hover {
          background-color: #f5f5f5;
          border-radius: 4px;
      }

      .dm-slideover-body {
          padding: 20px;
          flex: 1;
          overflow-y: auto;
      }

      .btn {
          padding: 8px 16px;
          margin: 5px;
          border: 1px solid #ccc;
          background: white;
          cursor: pointer;
          border-radius: 4px;
      }

      .btn:hover {
          background-color: #f5f5f5;
      }
  </style>
</head>
<body>
<h1>Slideover Component Test</h1>

<div class="test-card">
  <h2>Factory Method Tests</h2>
  <button class="btn" onclick="testFactoryMethod()">Create Slideover (Factory)</button>
  <button class="btn" onclick="testLeftSlideover()">Left Slideover</button>
  <button class="btn" onclick="testTopSlideover()">Top Slideover</button>
  <button class="btn" onclick="testBottomSlideover()">Bottom Slideover</button>
  <button class="btn" onclick="testCustomSize()">Custom Size (400px)</button>
</div>

<div class="test-card">
  <h2>Existing Element Tests</h2>
  <button class="btn" onclick="testExistingElement()">Use Existing Slideover</button>

  <!-- Pre-existing slideover element -->
  <div id="existing-slideover" style="display: none;">
    <div class="dm-slideover-header">
      <h5 class="dm-slideover-title">Existing Slideover</h5>
      <button type="button" class="dm-slideover-close" data-dismiss="slideover">×</button>
    </div>
    <div class="dm-slideover-body">
      <p>This is a pre-existing slideover element that gets enhanced by Domma.</p>
      <p>It includes proper header and close button structure.</p>
    </div>
  </div>
</div>

<div class="test-card">
  <h2>Advanced Features</h2>
  <button class="btn" onclick="testNonClosable()">Non-closable Slideover</button>
  <button class="btn" onclick="testNoBackdrop()">No Backdrop</button>
  <button class="btn" onclick="testWithCallbacks()">With Callbacks</button>
  <button class="btn" onclick="testProgrammaticControl()">Programmatic Control</button>
</div>

<div class="test-card">
  <h2>Content Tests</h2>
  <button class="btn" onclick="testFormContent()">Slideover with Form</button>
  <button class="btn" onclick="testDynamicContent()">Dynamic Content Updates</button>
</div>

<!-- Test results -->
<div id="test-results" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 4px;">
  <h3>Test Results:</h3>
  <div id="results-content">Ready to test...</div>
</div>

<script src="public/dist/domma.min.js"></script>
<script>
  let currentSlideover = null;

  function log(message) {
    document.getElementById('results-content').innerHTML += '<div>' + message + '</div>';
    console.log(message);
  }

  function clearLog() {
    document.getElementById('results-content').innerHTML = '';
  }

  function testFactoryMethod() {
    clearLog();
    log('Testing factory method...');

    currentSlideover = Domma.elements.slideover({
      title: 'Test Slideover',
      content: '<p>This slideover was created using the factory method!</p><p>It should slide in from the right by default.</p>',
      size: 'lg',
      onOpen: () => log('✓ onOpen callback fired'),
      onClose: () => log('✓ onClose callback fired'),
      onClosed: () => log('✓ onClosed callback fired')
    });

    currentSlideover.open();
    log('✓ Factory slideover created and opened');
  }

  function testLeftSlideover() {
    clearLog();
    log('Testing left position...');

    currentSlideover = Domma.elements.slideover({
      title: 'Left Slideover',
      content: '<p>This slideover slides in from the left!</p>',
      position: 'left',
      size: 'md'
    });

    currentSlideover.open();
    log('✓ Left slideover opened');
  }

  function testTopSlideover() {
    clearLog();
    log('Testing top position...');

    currentSlideover = Domma.elements.slideover({
      title: 'Top Slideover',
      content: '<p>This slideover slides down from the top!</p>',
      position: 'top',
      size: 'sm'
    });

    currentSlideover.open();
    log('✓ Top slideover opened');
  }

  function testBottomSlideover() {
    clearLog();
    log('Testing bottom position...');

    currentSlideover = Domma.elements.slideover({
      title: 'Bottom Slideover',
      content: '<p>This slideover slides up from the bottom!</p>',
      position: 'bottom',
      size: 'md'
    });

    currentSlideover.open();
    log('✓ Bottom slideover opened');
  }

  function testCustomSize() {
    clearLog();
    log('Testing custom size...');

    currentSlideover = Domma.elements.slideover({
      title: 'Custom Size',
      content: '<p>This slideover has a custom width of 400px!</p>',
      size: '400px'
    });

    currentSlideover.open();
    log('✓ Custom size (400px) slideover opened');
  }

  function testExistingElement() {
    clearLog();
    log('Testing existing element enhancement...');

    const existingEl = document.getElementById('existing-slideover');
    currentSlideover = Domma.elements.slideover(existingEl, {
      position: 'right',
      size: 'lg'
    });

    currentSlideover.open();
    log('✓ Existing element enhanced and opened');
  }

  function testNonClosable() {
    clearLog();
    log('Testing non-closable slideover...');

    currentSlideover = Domma.elements.slideover({
      title: 'Non-closable',
      content: '<p>This slideover cannot be closed with X button or backdrop.</p><button onclick="currentSlideover.close()" class="btn">Close Programmatically</button>',
      closable: false,
      backdropClose: false
    });

    currentSlideover.open();
    log('✓ Non-closable slideover opened');
  }

  function testNoBackdrop() {
    clearLog();
    log('Testing no backdrop...');

    currentSlideover = Domma.elements.slideover({
      title: 'No Backdrop',
      content: '<p>This slideover has no backdrop overlay.</p>',
      backdrop: false
    });

    currentSlideover.open();
    log('✓ No backdrop slideover opened');
  }

  function testWithCallbacks() {
    clearLog();
    log('Testing callbacks...');

    currentSlideover = Domma.elements.slideover({
      title: 'Callback Test',
      content: '<p>Watch the test results for callback messages!</p>',
      onOpen: () => log('🎉 Slideover opened!'),
      onClose: () => log('🔄 Slideover closing...'),
      onClosed: () => log('✅ Slideover fully closed!')
    });

    currentSlideover.open();
    log('✓ Callback test slideover created');
  }

  function testProgrammaticControl() {
    clearLog();
    log('Testing programmatic control...');

    currentSlideover = Domma.elements.slideover({
      title: 'Programmatic Control',
      content: `
                    <p>Test various methods:</p>
                    <button onclick="currentSlideover.setTitle('New Title')" class="btn">Change Title</button>
                    <button onclick="currentSlideover.setContent('<p>Updated content!</p>')" class="btn">Change Content</button>
                    <button onclick="currentSlideover.setSize('sm')" class="btn">Set Small</button>
                    <button onclick="currentSlideover.setSize('xl')" class="btn">Set XL</button>
                    <button onclick="currentSlideover.setPosition('left')" class="btn">Move Left</button>
                    <button onclick="currentSlideover.setPosition('right')" class="btn">Move Right</button>
                    <button onclick="currentSlideover.toggle()" class="btn">Toggle</button>
                    <p>Is open: <span id="is-open">?</span></p>
                `
    });

    currentSlideover.open();

    // Update status
    setInterval(() => {
      const statusEl = document.getElementById('is-open');
      if (statusEl && currentSlideover) {
        statusEl.textContent = currentSlideover.isOpen();
      }
    }, 500);

    log('✓ Programmatic control slideover opened');
  }

  function testFormContent() {
    clearLog();
    log('Testing form content...');

    currentSlideover = Domma.elements.slideover({
      title: 'Contact Form',
      content: `
                    <form id="test-form">
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Name:</label>
                            <input type="text" name="name" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Email:</label>
                            <input type="email" name="email" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px;">Message:</label>
                            <textarea name="message" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
                        </div>
                        <button type="submit" class="btn" style="background-color: #007bff; color: white; border-color: #007bff;">Submit</button>
                        <button type="button" onclick="currentSlideover.close()" class="btn">Cancel</button>
                    </form>
                `,
      size: 'md',
      onOpen: () => {
        // Bind form submit
        document.getElementById('test-form').addEventListener('submit', (e) => {
          e.preventDefault();
          log('✓ Form submitted (prevented default)');
          currentSlideover.close();
        });
      }
    });

    currentSlideover.open();
    log('✓ Form slideover opened');
  }

  function testDynamicContent() {
    clearLog();
    log('Testing dynamic content...');

    currentSlideover = Domma.elements.slideover({
      title: 'Dynamic Content',
      content: '<p>Loading...</p>',
      size: 'md'
    });

    currentSlideover.open();

    // Simulate loading content
    setTimeout(() => {
      currentSlideover.setContent(`
                    <h4>Loaded Content!</h4>
                    <p>This content was loaded after the slideover opened.</p>
                    <ul>
                        <li>Item 1</li>
                        <li>Item 2</li>
                        <li>Item 3</li>
                    </ul>
                `);
      log('✓ Content updated dynamically');
    }, 1000);

    log('✓ Dynamic content slideover opened');
  }

  // Global keyboard listener for testing
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && currentSlideover && currentSlideover.isOpen()) {
      log('✓ Escape key detected - slideover should close');
    }
  });

  log('✅ Test page loaded. Slideover component ready for testing!');
</script>
</body>
</html>
