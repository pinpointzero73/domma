<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domma Enhanced Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .color-box:hover {
            transform: rotate(5deg) scale(1.1);
        }

        #output {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            min-height: 60px;
            border-left: 4px solid #667eea;
        }

        .todo-item {
            padding: 12px;
            background: white;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e0e0e0;
            transition: all 0.2s ease;
        }

        .todo-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .todo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        input[type="text"] {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            width: 300px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .delete-btn {
            background: #ff6b6b;
            padding: 6px 12px;
            font-size: 14px;
        }

        .stats {
            text-align: center;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Domma Enhanced Demo</h1>

        <div class="card">
            <h2>Color Switcher</h2>
            <p>Click the boxes to change their colors:</p>
            <div id="color-container">
                <div class="color-box" id="box1" style="background: #ff6b6b;"></div>
                <div class="color-box" id="box2" style="background: #4ecdc4;"></div>
                <div class="color-box" id="box3" style="background: #ffe66d;"></div>
            </div>
        </div>

        <div class="card">
            <h2>HTTP Request Demo</h2>
            <button id="fetch-users">Fetch Users</button>
            <button id="fetch-posts">Fetch Posts</button>
            <div id="output">Click a button to fetch data from JSONPlaceholder API...</div>
        </div>

        <div class="card">
            <h2>Todo List</h2>
            <input type="text" id="todo-input" placeholder="Enter a new todo...">
            <button id="add-todo">Add Todo</button>
            <div id="todo-list"></div>
            <div class="stats" id="todo-stats">0 tasks</div>
        </div>
    </div>

    <script type="module">
        import Domma from './src/index.js';

        // JSON Configuration
        const config = {
            '#box1': {
                events: {
                    click: {
                        css: {
                            backgroundColor: '#' + Math.floor(Math.random() * 16777215).toString(16)
                        }
                    }
                }
            },
            '#box2': {
                events: {
                    click: {
                        css: {
                            backgroundColor: '#' + Math.floor(Math.random() * 16777215).toString(16)
                        }
                    }
                }
            },
            '#box3': {
                events: {
                    click: {
                        css: {
                            backgroundColor: '#' + Math.floor(Math.random() * 16777215).toString(16)
                        }
                    }
                }
            }
        };

        Domma.setup(config);

        // HTTP Demos
        Domma('#fetch-users').click(async () => {
            Domma('#output').html('<em>Loading...</em>');
            try {
                const users = await Domma.http.get('https://jsonplaceholder.typicode.com/users');
                const userList = users.slice(0, 3).map(u =>
                    `<strong>${u.name}</strong> (${u.email})`
                ).join('<br>');
                Domma('#output').html(`<strong>Top 3 Users:</strong><br>${userList}`);
            } catch (e) {
                Domma('#output').html('<span style="color: red;">Error fetching users</span>');
            }
        });

        Domma('#fetch-posts').click(async () => {
            Domma('#output').html('<em>Loading...</em>');
            try {
                const posts = await Domma.http.get('https://jsonplaceholder.typicode.com/posts');
                const postList = posts.slice(0, 3).map(p =>
                    `<strong>${p.title}</strong>`
                ).join('<br>');
                Domma('#output').html(`<strong>Top 3 Posts:</strong><br>${postList}`);
            } catch (e) {
                Domma('#output').html('<span style="color: red;">Error fetching posts</span>');
            }
        });

        // Todo List
        let todos = [];

        function renderTodos() {
            const html = todos.map((todo, index) =>
                `<div class="todo-item ${todo.completed ? 'completed' : ''}" data-index="${index}">
                    <span>${todo.text}</span>
                    <button class="delete-btn" data-index="${index}">Delete</button>
                </div>`
            ).join('');
            Domma('#todo-list').html(html);

            // Bind delete buttons
            Domma('.delete-btn').on('click', (e) => {
                const index = e.target.getAttribute('data-index');
                todos.splice(index, 1);
                renderTodos();
            });

            // Bind todo items for completion toggle
            Domma('.todo-item').on('click', (e) => {
                if (!e.target.classList.contains('delete-btn')) {
                    const index = e.currentTarget.getAttribute('data-index');
                    todos[index].completed = !todos[index].completed;
                    renderTodos();
                }
            });

            updateStats();
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            Domma('#todo-stats').text(`${total} task${total !== 1 ? 's' : ''} (${completed} completed)`);
        }

        Domma('#add-todo').click(() => {
            const text = Domma('#todo-input').elements[0].value.trim();
            if (text) {
                todos.push({ text, completed: false });
                Domma('#todo-input').elements[0].value = '';
                renderTodos();
            }
        });

        Domma('#todo-input').on('keypress', (e) => {
            if (e.key === 'Enter') {
                Domma('#add-todo').elements[0].click();
            }
        });

        console.log('Domma Enhanced Demo Loaded 🚀');
    </script>
</body>

</html>
