<div class="grid grid-cols-2 gap-4 mb-4"><div class="form-group">
        <label class="form-label" for="x-pw">New password</label>
        <input id="x-pw" class="form-input" type="password" autocomplete="new-password">
    </div>
    <div class="form-group">
        <label class="form-label" for="x-q">Filter</label>
        <input id="x-q" class="form-input" type="search" value="invoices">
    </div>
    <div class="form-group">
        <label class="form-label" for="x-qty">Quantity</label>
        <input id="x-qty" class="form-input" type="number" min="0" max="10" value="2">
    </div>
    <div class="form-group">
        <label class="form-label" for="x-note">Delivery note</label>
        <input id="x-note" class="form-input" type="text" maxlength="40">
    </div>
</div>
