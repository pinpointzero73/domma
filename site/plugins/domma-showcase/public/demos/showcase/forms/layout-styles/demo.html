<div class="forms-controls">
    <button type="button" class="btn btn-primary btn-sm" id="layout-stacked">
        <span data-icon="layout" data-icon-size="16"></span>
        Stacked
    </button>
    <button type="button" class="btn btn-success btn-sm" id="layout-grid">
        <span data-icon="grid" data-icon-size="16"></span>
        Grid (2-col)
    </button>
    <button type="button" class="btn btn-info btn-sm" id="layout-sections">
        <span data-icon="folder-open" data-icon-size="16"></span>
        With Sections
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="clear-layout-form">
        <span data-icon="trash" data-icon-size="16"></span>
        Clear
    </button>
</div>
<div id="layout-form-container">
    <div class="card mt-4" data-if="shown.value">
        <div class="card-header">
            <h4 class="card-title mb-0"><span data-bind-text="layoutType.value"></span> Layout Demo</h4>
        </div>
        <div class="card-body" id="layout-form-wrapper"></div>
    </div>
</div>
