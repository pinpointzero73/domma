<div class="forms-controls">
    <button type="button" class="btn btn-primary btn-sm" id="chooser-card-generate">
        <span data-icon="check-square" data-icon-size="16"></span>
        Generate card chooser
    </button>
    <button type="button" class="btn btn-info btn-sm" id="chooser-chip-generate">
        <span data-icon="tag" data-icon-size="16"></span>
        Generate chip multi-select
    </button>
    <button type="button" class="btn btn-success btn-sm" id="chooser-visual-generate">
        <span data-icon="star" data-icon-size="16"></span>
        Visual options (glow + accent)
    </button>
    <button type="button" class="btn btn-warning btn-sm" id="chooser-validate">
        <span data-icon="alert-triangle" data-icon-size="16"></span>
        Validate
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="chooser-submit">
        <span data-icon="send" data-icon-size="16"></span>
        Get values
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="chooser-clear">
        <span data-icon="trash" data-icon-size="16"></span>
        Clear
    </button>
</div>
<div id="chooser-form-container"></div>
<div class="forms-output" id="chooser-output">Submit or validate to see captured values</div>
