<div class="forms-controls">
    <button type="button" class="btn btn-primary btn-sm" id="generate-validation-form">
        <span data-icon="check" data-icon-size="16"></span>
        Generate Validation Form
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="clear-validation-form">
        <span data-icon="trash" data-icon-size="16"></span>
        Clear
    </button>
</div>
<div id="validation-form-container">
    <div class="card mt-4" data-if="shown.value">
        <div class="card-header">
            <h4 class="card-title mb-0">Interactive Validation Form</h4>
        </div>
        <div class="card-body" id="validation-form-wrapper"></div>
    </div>
</div>
<div class="forms-output" id="validation-output">Form validation results will appear here...</div>
