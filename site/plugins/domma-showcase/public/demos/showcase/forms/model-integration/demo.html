<div class="forms-controls">
    <button type="button" class="btn btn-primary btn-sm" id="create-model-form">
        <span data-icon="database" data-icon-size="16"></span>
        Create Model Form
    </button>
    <button type="button" class="btn btn-info btn-sm" id="load-saved-data">
        <span data-icon="download" data-icon-size="16"></span>
        Load Saved Data
    </button>
    <button type="button" class="btn btn-warning btn-sm" id="clear-saved-data">
        <span data-icon="trash" data-icon-size="16"></span>
        Clear Storage
    </button>
</div>
<div id="model-form-container">
    <div class="card mt-4" data-if="shown.value">
        <div class="card-header">
            <h4 class="card-title mb-0">Model Integration Form</h4>
                <small class="text-muted">Changes automatically sync to localStorage</small>
        </div>
        <div class="card-body" id="model-form-wrapper"></div>
    </div>
</div>
<div class="forms-output" id="model-output">Model changes and persistence will be logged here...</div>
