<div class="forms-controls">
    <button type="button" class="btn btn-primary btn-sm" id="generate-basic-form">
        <span data-icon="plus" data-icon-size="16"></span>
        Generate Form
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="clear-basic-form">
        <span data-icon="trash" data-icon-size="16"></span>
        Clear
    </button>
</div>
<div id="basic-form-container">
    <div class="card mt-4" data-if="shown.value">
        <div class="card-header">
            <h4 class="card-title mb-0">Generated Basic Form</h4>
        </div>
        <div class="card-body" id="basic-form-wrapper"></div>
    </div>
</div>
<div class="forms-output" id="basic-form-output">Click "Generate Form" to see the blueprint-driven form...
</div>
