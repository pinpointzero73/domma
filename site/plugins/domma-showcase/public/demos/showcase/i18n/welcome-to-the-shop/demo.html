<h3 class="text-lg font-semibold mb-2" data-i18n="shop.title">Welcome to the shop</h3>
<p class="mb-3" data-i18n="shop.intro">Everything on this card comes from data-i18n attributes.</p>
<p class="mb-3" data-i18n-html="shop.signedIn" data-i18n-params="{&quot;name&quot;: &quot;Ann&quot;}">Signed in as <strong>Ann</strong></p>
<p class="mb-3" data-i18n="shop.items" data-i18n-params="{&quot;count&quot;: 3}">3 items in your cart</p>
<div class="form-group">
    <label for="shop-search" data-i18n="shop.searchLabel">Search</label>
    <input id="shop-search" type="search" class="form-input" placeholder="Search products" data-i18n-attr="placeholder:shop.searchPlaceholder; title:shop.searchHint">
</div>
<p class="m-0" data-i18n="shop.onlyInEnglish">This line is only written in English - it falls back.</p>
