<label>Density</label>
<input type="range" id="opt-density" min="10" max="200" value="60">
<span id="val-density">60</span>
<label>Speed</label>
<input type="range" id="opt-speed" min="0.2" max="3" step="0.1" value="1">
<span id="val-speed">1</span>
<label>Sway</label>
<input type="range" id="opt-sway" min="0" max="200" step="5" value="60">
<span id="val-sway">60</span>
<label>Rotation</label>
<input type="range" id="opt-rotation" min="0" max="20" step="0.5" value="6">
<span id="val-rotation">6</span>
<label>Fade Start</label>
<input type="range" id="opt-fade" min="0.1" max="0.95" step="0.05" value="0.55">
<span id="val-fade">0.55</span>
<div class="tape-container mt-4" id="tape-container-3"></div>
<button type="button" class="btn btn-primary" id="apply-3">Apply</button>
<button type="button" class="btn btn-danger" id="destroy-3">Destroy</button>
