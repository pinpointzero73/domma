<label>Density</label>
<input type="range" id="opt-density" min="5" max="60" value="18">
<span id="val-density">18</span>
<label>Speed</label>
<input type="range" id="opt-speed" min="0.2" max="3" step="0.1" value="1">
<span id="val-speed">1</span>
<label>Wander</label>
<input type="range" id="opt-wander" min="0.2" max="3" step="0.1" value="1">
<span id="val-wander">1</span>
<label>Rise Speed</label>
<input type="range" id="opt-rise" min="0" max="2" step="0.1" value="0.4">
<span id="val-rise">0.4</span>
<label>Flap Speed</label>
<input type="range" id="opt-flap" min="0.2" max="3" step="0.1" value="1">
<span id="val-flap">1</span>
<div class="butterfly-container mt-4" id="butterfly-container-3"></div>
<button type="button" class="btn btn-primary" id="apply-3">Apply</button>
<button type="button" class="btn btn-danger" id="destroy-3">Destroy</button>
