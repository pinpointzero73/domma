<div class="star-container" id="star-container-1">
    <div class="star-container-label">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">✦</div>
        <div>Stars are rendered in this container</div>
        <div style="font-size: 0.85rem; opacity: 0.7; margin-top: 0.3rem;">Click Start to initialise</div>
    </div>
</div>
<span id="status-1" class="status-badge stopped"><span class="status-dot"></span><span class="status-text">Stopped</span></span>
<button type="button" class="btn btn-primary" id="start-1">Start</button>
<button type="button" class="btn btn-secondary" id="pause-1">Pause</button>
<button type="button" class="btn btn-secondary" id="resume-1">Resume</button>
<button type="button" class="btn btn-secondary" id="restart-1">Restart</button>
<button type="button" class="btn btn-danger" id="destroy-1">Destroy</button>
