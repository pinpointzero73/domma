        <li><code>≥ 576px</code>: Columns display at their specified widths</li>
    </ul>
    <p class="mt-4"><strong>Try it:</strong> Resize your browser window to see the columns below stack on
        mobile.</p>

    <div class="row mt-4">
        <div class="col-4">
            <div class="demo-col-grid">.col-4</div>
        </div>
        <div class="col-4">
            <div class="demo-col-grid demo-col-alt">.col-4</div>
        </div>
        <div class="col-4">
            <div class="demo-col-grid demo-col-warning">.col-4</div>
        </div>
    </div>
</div>
