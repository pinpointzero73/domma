<div>
    <label for="in-text">Customer name</label>
    <input id="in-text" type="text" class="form-input" value="Alice Bloggs">
</div>
<div>
    <label for="in-email">Email address</label>
    <input id="in-email" type="email" class="form-input" value="alice@example.com">
</div>
<div>
    <label for="in-pass">Password</label>
    <input id="in-pass" type="password" class="form-input" value="hunter2hunter2">
</div>
<div>
    <label for="in-num">Order quantity</label>
    <input id="in-num" type="number" class="form-input" value="42">
</div>
<div>
    <label for="in-date">Invoice date</label>
    <input id="in-date" type="date" class="form-input" value="2026-04-22">
</div>
<div>
    <label for="in-select">Status</label>
    <select id="in-select" class="form-input">
        <option>Draft</option>
        <option selected="">In review</option>
        <option>Approved</option>
        <option>Rejected</option>
    </select>
</div>
<div style="grid-column: 1 / -1;">
    <label for="in-textarea">Notes</label>
    <textarea id="in-textarea" class="form-input" rows="3">Customer requested next-day delivery; left a note to wrap securely.</textarea>
</div>
<div>
    <label><input type="checkbox" checked=""> Subscribe to weekly digest</label><br>
    <label><input type="checkbox"> Receive marketing emails</label>
</div>
<div>
    <label><input type="radio" name="r-priority" checked=""> Standard priority</label><br>
    <label><input type="radio" name="r-priority"> Express priority</label>
</div>
<div>
    <label for="in-file">Upload signed PDF</label>
    <input id="in-file" type="file" class="form-input">
</div>
