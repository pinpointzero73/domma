<div class="flex gap-2 items-center">
    <span class="text-sm">Page Size:</span>
    <select id="page-size" class="form-select" style="width: 80px;">
        <option value="5">5</option>
        <option value="10" selected="">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
    </select>
    <button type="button" class="btn btn-outline btn-sm" id="first-page">First</button>
    <button type="button" class="btn btn-outline btn-sm" id="prev-page">Prev</button>
    <button type="button" class="btn btn-outline btn-sm" id="next-page">Next</button>
    <button type="button" class="btn btn-outline btn-sm" id="last-page">Last</button>
</div>
