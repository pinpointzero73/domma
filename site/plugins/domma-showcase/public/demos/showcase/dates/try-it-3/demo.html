<p class="text-sm text-muted mb-3">Starting from: <strong id="manip-base"></strong></p>
<div class="flex gap-2 flex-wrap mb-3">
    <button type="button" class="btn btn-outline btn-sm" data-manip="add-7-days">+7 days</button>
    <button type="button" class="btn btn-outline btn-sm" data-manip="add-1-month">+1 month</button>
    <button type="button" class="btn btn-outline btn-sm" data-manip="sub-1-week">-1 week</button>
    <button type="button" class="btn btn-outline btn-sm" data-manip="startOf-month">startOf('month')</button>
    <button type="button" class="btn btn-outline btn-sm" data-manip="endOf-month">endOf('month')</button>
    <button type="button" class="btn btn-outline btn-sm" data-manip="startOf-year">startOf('year')</button>
</div>
<div class="demo-result-style" id="manip-result">Click a button to manipulate the date</div>
