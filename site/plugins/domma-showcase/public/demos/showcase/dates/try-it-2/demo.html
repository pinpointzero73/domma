<input type="text" id="format-input" class="form-input mb-3" value="MMMM D, YYYY h:mm A" placeholder="Enter format string">
<div class="flex gap-2 flex-wrap mb-3">
    <button type="button" class="btn btn-outline btn-sm" data-format="YYYY-MM-DD">YYYY-MM-DD</button>
    <button type="button" class="btn btn-outline btn-sm" data-format="MMMM D, YYYY">MMMM D, YYYY</button>
    <button type="button" class="btn btn-outline btn-sm" data-format="dddd, MMM D">dddd, MMM D</button>
    <button type="button" class="btn btn-outline btn-sm" data-format="h:mm A">h:mm A</button>
    <button type="button" class="btn btn-primary btn-sm" id="format-btn">Format</button>
</div>
<div class="demo-result-style" id="format-result">Click a format or enter your own</div>
