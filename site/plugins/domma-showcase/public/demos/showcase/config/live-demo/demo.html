<form id="live-form" class="grid grid-cols-2 gap-4 max-w-500px">
    <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" id="live-name" class="form-input" placeholder="Your name">
    </div>
    <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="live-email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="col-span-2">
        <button type="submit" id="live-submit" class="btn btn-primary">Send Message</button>
    </div>
</form>
