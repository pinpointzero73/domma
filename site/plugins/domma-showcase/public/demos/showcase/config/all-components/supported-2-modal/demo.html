<button type="button" id="open-modal-btn" class="btn btn-primary">Open Modal</button>

<div id="demo-modal" class="modal">
    <div class="modal-header">
        <h5 class="modal-title">Modal Title</h5>
        <button type="button" class="modal-close">×</button>
    </div>
    <div class="modal-body">
        <p>This modal was configured via $.setup()</p>
        <p class="text-muted">Press ESC or click backdrop to close</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn modal-close">Close</button>
        <button type="button" class="btn btn-primary">Save</button>
    </div>
</div>
