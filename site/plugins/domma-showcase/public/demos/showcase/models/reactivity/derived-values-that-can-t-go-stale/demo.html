<div class="row mb-4"><div class="col-6">
        <label class="form-label" for="rx-price">Price (read by the computed)</label>
        <input type="number" class="form-input mb-3" id="rx-price" value="10">

        <label class="form-label" for="rx-qty">Quantity (read by the computed)</label>
        <input type="number" class="form-input mb-3" id="rx-qty" value="3">

        <label class="form-label" for="rx-note">Note (<strong>not</strong> read by the computed)</label>
        <input type="text" class="form-input mb-3" id="rx-note" placeholder="Type here…">

        <button type="button" class="btn btn-outline" id="rx-read">Read total again</button>
    </div>
    <div class="col-6">
        <div class="row">
            <div class="col-6 mb-3">
                <div class="rx-stat">
                    <div class="rx-stat-label">Total</div>
                    <div class="rx-counter" id="rx-total">30</div>
                </div>
            </div>
            <div class="col-6 mb-3">
                <div class="rx-stat rx-flash" id="rx-evals-box">
                    <div class="rx-stat-label">Body evaluations</div>
                    <div class="rx-counter" id="rx-evals">1</div>
                </div>
            </div>
        </div>
        <p class="text-sm">
            Change <strong>Price</strong> or <strong>Quantity</strong> and the counter rises. Type a
            whole paragraph into <strong>Note</strong> - the model updates on every keystroke, and the
            counter does not move once. Press <strong>Read total again</strong> as often as you like:
            repeated reads are served from cache and cost nothing.
        </p>
    </div>
</div>
