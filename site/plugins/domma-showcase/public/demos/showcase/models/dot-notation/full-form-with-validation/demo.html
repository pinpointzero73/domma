<form id="registration-form">
    <div class="form-grid mb-4">
        <div class="form-group">
            <label class="form-label">First Name *</label>
            <input type="text" name="personal.firstName" class="form-input" placeholder="John" required="">
        </div>
        <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input type="text" name="personal.lastName" class="form-input" placeholder="Doe" required="">
        </div>
        <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" name="personal.email" class="form-input" placeholder="john@example.com" required="">
        </div>
        <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" name="personal.phone" class="form-input" placeholder="+1 234 567 8900">
        </div>
        <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text" name="address.street" class="form-input" placeholder="123 Main St">
        </div>
        <div class="form-group">
            <label class="form-label">City *</label>
            <input type="text" name="address.city" class="form-input" placeholder="New York" required="">
        </div>
        <div class="form-group">
            <label class="form-label">State/Province</label>
            <input type="text" name="address.state" class="form-input" placeholder="NY">
        </div>
        <div class="form-group">
            <label class="form-label">ZIP/Postal Code</label>
            <input type="text" name="address.zip" class="form-input" placeholder="10001">
        </div>
        <div class="form-group">
            <label class="form-label">Country *</label>
            <select name="address.country" class="form-select" required="">
                <option value="">Select Country</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="GB">United Kingdom</option>
                <option value="AU">Australia</option>
                <option value="OTHER">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Account Type</label>
            <select name="account.type" class="form-select">
                <option value="personal">Personal</option>
                <option value="business">Business</option>
                <option value="premium">Premium</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">
                <input type="checkbox" name="account.newsletter" value="true">
                Subscribe to newsletter
            </label>
        </div>
        <div class="form-group">
            <label class="form-label">
                <input type="checkbox" name="account.terms" value="true" required="">
                I agree to the terms and conditions *
            </label>
        </div>
    </div>

    <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">Submit Registration</button>
        <button type="button" class="btn btn-secondary" id="reset-form">Reset Form</button>
        <button type="button" class="btn btn-info" id="populate-form">Populate Sample Data</button>
    </div>
</form>

<div class="validation-message mt-4" id="validation-message" style="display: none;"></div>

<div class="mt-4">
    <h4 class="font-semibold mb-2">Serialized Form Data (with dot notation):</h4>
    <div class="nested-display" id="ex3-display">Submit the form to see the data structure</div>
</div>
