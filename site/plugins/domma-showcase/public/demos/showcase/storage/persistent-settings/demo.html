<p class="text-muted mb-4">Change these settings and refresh the page - they'll persist!</p>

<div class="grid grid-cols-3 gap-4 mb-4">
    <div class="form-group">
        <label>Theme</label>
        <select id="pref-theme" class="form-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>
    <div class="form-group">
        <label>Font Size</label>
        <input type="number" id="pref-fontsize" class="form-input" min="10" max="24" value="14">
    </div>
    <div class="form-group">
        <label>Notifications</label>
        <select id="pref-notifications" class="form-select">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
        </select>
    </div>
</div>

<div class="flex gap-2">
    <button type="button" class="btn btn-outline" id="btn-reset-prefs">Reset to Defaults</button>
    <button type="button" class="btn btn-danger btn-sm" id="btn-clear-prefs">Clear Storage</button>
</div>

<div class="storage-demo-result mt-4" id="prefs-state">Loading...</div>
