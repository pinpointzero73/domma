<input type="text" id="string-input" class="form-input mb-3" value="hello world example">
<div class="flex gap-2 flex-wrap mb-3">
    <button type="button" class="btn btn-outline btn-sm" data-string="camelCase">camelCase</button>
    <button type="button" class="btn btn-outline btn-sm" data-string="kebabCase">kebabCase</button>
    <button type="button" class="btn btn-outline btn-sm" data-string="snakeCase">snakeCase</button>
    <button type="button" class="btn btn-outline btn-sm" data-string="startCase">startCase</button>
    <button type="button" class="btn btn-outline btn-sm" data-string="capitalize">capitalize</button>
</div>
<div class="utils-demo-result" id="string-result">Click a button to transform the string</div>
