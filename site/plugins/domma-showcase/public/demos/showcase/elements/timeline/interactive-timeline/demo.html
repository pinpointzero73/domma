<div id="interactive-timeline"></div>
<div class="mt-3">
    <button type="button" class="btn btn-primary" id="add-item">Add New Item</button>
    <button type="button" class="btn btn-secondary" id="change-layout">Toggle Layout</button>
</div>
<div class="mt-3">
    <div class="alert alert-info" id="click-output" data-if="clicked.value">
        <strong>Clicked:</strong> <span data-bind-text="clicked.value">Click on timeline items to see event handling in action!</span>
    </div>
</div>
