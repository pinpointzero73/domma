<button id="demo-modal-open" class="btn btn-outline mb-4" type="button">Open a modal</button>
<div id="demo-modal" class="modal">
    <div class="modal-header">
        <h5 class="modal-title">Invite a colleague</h5>
        <button class="modal-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
        <label class="form-label" for="demo-modal-role">Role
            <button id="demo-modal-help" type="button" class="sx-pop-help" aria-label="About roles">
                <span data-icon="help-circle" data-icon-size="16"></span>
            </button>
        </label>
        <select id="demo-modal-role" class="form-select">
            <option>Editor</option>
            <option>Viewer</option>
        </select>
    </div>
</div>
