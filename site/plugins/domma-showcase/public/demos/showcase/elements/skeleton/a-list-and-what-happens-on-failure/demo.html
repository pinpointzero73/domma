<button id="demo-list-load" class="btn btn-primary btn-sm" type="button" data-on-click="load" data-bind-disabled="busy.value">
    <span data-icon="users"></span> Load
</button>
<button id="demo-list-fail" class="btn btn-outline btn-sm" type="button" data-on-click="loadAndFail" data-bind-disabled="busy.value">
    <span data-icon="zap"></span> Load and fail
</button>
<div id="demo-list" class="mb-4">
    <ul class="list-group" data-if="people.value.length === 0">
        <li class="list-group-item">Nothing loaded yet - press Load.</li>
    </ul>
    <div data-if="people.value.length > 0">
        <ul class="list-group" data-each="people.value key=name">
            <li class="list-group-item">
                <span class="list-group-item-icon"><span class="sx-sk-avatar" data-bind-text="initials"></span></span>
                <span class="list-group-item-content">
                    <span class="list-group-item-heading" data-bind-text="name"></span>
                    <span class="list-group-item-text" data-bind-text="role"></span>
                </span>
            </li>
        </ul>
    </div>
</div>
