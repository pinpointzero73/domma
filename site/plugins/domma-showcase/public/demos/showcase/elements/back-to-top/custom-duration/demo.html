<div class="demo-scroll-container" id="duration-demo" style="height: 300px; overflow-y: auto; border: 1px solid var(--dm-color-border, #e0e0e0); border-radius: 0.5rem; padding: 1.5rem; position: relative;">
    <div style="min-height: 1000px;">
        <p>Try different scroll speeds...</p>
        <div class="flex gap-2 mt-4">
            <button type="button" class="btn btn-sm btn-outline" data-action="1">Fast (200ms)</button>
            <button type="button" class="btn btn-sm btn-outline" data-action="2">Slow (1000ms)</button>
        </div>
        <p class="mt-300">Scroll down to see the button</p>
    </div>
    <button type="button" id="duration-btn" class="btn btn-primary back-to-top-btn">↑</button>
</div>
