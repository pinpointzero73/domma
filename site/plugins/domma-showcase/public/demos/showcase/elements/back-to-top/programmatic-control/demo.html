<div class="flex gap-2 justify-center mb-3">
    <button type="button" id="prog-show" class="btn btn-outline btn-sm">Show</button>
    <button type="button" id="prog-hide" class="btn btn-outline btn-sm">Hide</button>
    <button type="button" id="prog-toggle" class="btn btn-outline btn-sm">Toggle</button>
    <button type="button" id="prog-scroll" class="btn btn-outline btn-sm">Scroll to Top</button>
</div>
<div class="demo-scroll-container" id="programmatic-demo" style="height: 300px; overflow-y: auto; border: 1px solid var(--dm-color-border, #e0e0e0); border-radius: 0.5rem; padding: 1.5rem; position: relative;">
    <div style="min-height: 800px;">
        <p>Use buttons above to control the back to top button</p>
        <p class="mt-600">Scroll position tracked</p>
    </div>
    <button type="button" id="programmatic-btn" class="btn btn-primary back-to-top-btn">↑</button>
</div>
