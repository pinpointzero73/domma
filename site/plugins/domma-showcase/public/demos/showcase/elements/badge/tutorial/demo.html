<div class="badge-card-width-center">
    <div class="card">
        <div class="card-body">
            <div class="flex items-center justify-between mb-3">
                <h3 class="m-0">Notifications</h3>
                <span id="notification-count" class="badge badge-danger">3</span>
            </div>
            <ul class="list-none p-0 m-0">
                <li class="p-3 border-b border-dm-border">
                    <div class="flex items-center justify-between">
                        <span>New message received</span>
                        <span class="badge badge-sm badge-primary">New</span>
                    </div>
                </li>
                <li class="p-3 border-b border-dm-border">
                    <div class="flex items-center justify-between">
                        <span>Task completed</span>
                        <span class="badge badge-sm badge-success">Done</span>
                    </div>
                </li>
                <li class="p-3">
                    <div class="flex items-center justify-between">
                        <span>Server alert</span>
                        <span class="badge badge-sm badge-warning">Warning</span>
                    </div>
                </li>
            </ul>
            <div class="mt-3 text-center">
                <button type="button" id="clear-notifications" class="btn btn-sm btn-outline">Clear All</button>
            </div>
        </div>
    </div>
</div>
