<button type="button" class="btn btn-danger" id="tutorial-delete-btn">Delete Item</button>
<div class="demo-result mt-2" id="tutorial-result"></div>

<div id="tutorial-modal" class="modal">
    <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="modal-close">×</button>
    </div>
    <div class="modal-body">
        <p class="mb-2">Are you sure you want to delete this item?</p>
        <p class="text-sm">This action cannot be undone.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="tutorial-confirm">Delete</button>
    </div>
</div>
