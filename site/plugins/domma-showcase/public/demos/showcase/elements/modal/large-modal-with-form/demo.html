<button type="button" class="btn btn-primary" id="open-large">Open Large Modal</button>

<div id="large-modal" class="modal modal-lg">
    <div class="modal-header">
        <h5 class="modal-title">Contact Form</h5>
        <button type="button" class="modal-close">×</button>
    </div>
    <div class="modal-body">
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input" placeholder="John">
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input" placeholder="Doe">
            </div>
            <div class="form-group col-span-full">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" placeholder="john@example.com">
            </div>
            <div class="form-group col-span-full">
                <label class="form-label">Message</label>
                <textarea class="form-textarea" rows="3" placeholder="Your message..."></textarea>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
        <button type="button" class="btn btn-primary">Send Message</button>
    </div>
</div>
