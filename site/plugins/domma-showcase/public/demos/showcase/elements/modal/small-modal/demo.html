<button type="button" class="btn btn-secondary" id="open-small">Open Small Modal</button>

<div id="small-modal" class="modal modal-sm">
    <div class="modal-header">
        <h5 class="modal-title">Quick Message</h5>
        <button type="button" class="modal-close">×</button>
    </div>
    <div class="modal-body">
        <p>This is a small modal for brief messages.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary btn-sm modal-close-btn">OK</button>
    </div>
</div>
