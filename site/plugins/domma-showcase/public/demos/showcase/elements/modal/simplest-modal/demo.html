<button type="button" class="btn btn-primary" id="quick-start-btn">Try It - Open Modal</button>

<div id="quick-start-modal" class="modal">
    <div class="modal-header">
        <h5 class="modal-title">Welcome!</h5>
        <button type="button" class="modal-close">×</button>
    </div>
    <div class="modal-body">
        <p>This is a simple modal dialog. You can close it by clicking the X, the backdrop, or pressing
            Escape.</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary modal-close-btn">Got It</button>
    </div>
</div>
