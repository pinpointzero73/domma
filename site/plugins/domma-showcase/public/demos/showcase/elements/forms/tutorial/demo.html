<form id="tutorial-form" class="forms-max-w-500-center">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="John Doe" required="">
        <small class="form-text">Enter your first and last name</small>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="john@example.com" required="">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required="">
        <small class="form-text">Must be at least 8 characters</small>
    </div>

    <div class="form-group">
        <label>Account Type</label>
        <select id="account-type" class="form-select">
            <option value="">Select type...</option>
            <option value="personal">Personal</option>
            <option value="business">Business</option>
            <option value="enterprise">Enterprise</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-checkbox">
            <input type="checkbox" id="terms" required="">
            <span>I agree to the terms and conditions</span>
        </label>
    </div>

    <button type="submit" class="btn btn-primary w-full">Create Account</button>
</form>

<div id="tutorial-result" class="mt-4 p-3 bg-surface rounded text-center">
    <p class="text-muted text-sm">Fill out the form and submit</p>
</div>
