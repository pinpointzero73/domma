<div class="forms-max-w-500-center">
    <div class="form-group">
        <label>Checkboxes</label>
        <label class="form-checkbox">
            <input type="checkbox">
            <span>Option 1</span>
        </label>
        <label class="form-checkbox">
            <input type="checkbox" checked="">
            <span>Option 2 (checked)</span>
        </label>
        <label class="form-checkbox">
            <input type="checkbox" disabled="">
            <span>Option 3 (disabled)</span>
        </label>
    </div>

    <div class="form-group">
        <label>Radio Buttons</label>
        <label class="form-radio">
            <input type="radio" name="radio-demo" checked="">
            <span>Choice 1</span>
        </label>
        <label class="form-radio">
            <input type="radio" name="radio-demo">
            <span>Choice 2</span>
        </label>
        <label class="form-radio">
            <input type="radio" name="radio-demo" disabled="">
            <span>Choice 3 (disabled)</span>
        </label>
    </div>
</div>
