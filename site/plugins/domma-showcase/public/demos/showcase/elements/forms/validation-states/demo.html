<div class="forms-max-w-500-center">
    <div class="form-group has-success">
        <label>Success</label>
        <input type="text" class="form-input" value="Valid input">
        <small class="form-text text-success">Looks good!</small>
    </div>
    <div class="form-group has-error">
        <label>Error</label>
        <input type="text" class="form-input" value="Invalid input">
        <small class="form-text text-danger">This field is required</small>
    </div>
    <div class="form-group has-warning">
        <label>Warning</label>
        <input type="text" class="form-input" value="Unusual input">
        <small class="form-text text-warning">Are you sure?</small>
    </div>
</div>
