<div class="forms-max-w-500-center">
    <div class="form-group">
        <label>Text Input</label>
        <input type="text" class="form-input" placeholder="Enter text">
    </div>
    <div class="form-group">
        <label>Email Input</label>
        <input type="email" class="form-input" placeholder="email@example.com">
    </div>
    <div class="form-group">
        <label>Number Input</label>
        <input type="number" class="form-input" placeholder="123">
    </div>
    <div class="form-group">
        <label>Date Input</label>
        <input type="date" class="form-input">
    </div>
    <div class="form-group">
        <label>Textarea</label>
        <textarea class="form-textarea" rows="3" placeholder="Enter long text..."></textarea>
    </div>
</div>
