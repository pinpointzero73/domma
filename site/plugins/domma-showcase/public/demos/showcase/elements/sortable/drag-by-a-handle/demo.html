<div id="demo-fields" class="sx-sort-list mb-4">
    <div class="sx-sort-item" data-id="name">
        <span class="sx-sort-grip" data-icon="grip-vertical" tabindex="0" aria-label="Move Name"></span>
        <input class="form-input sx-sort-field" type="text" value="Name" aria-label="Field label">
    </div>
    <div class="sx-sort-item" data-id="email">
        <span class="sx-sort-grip" data-icon="grip-vertical" tabindex="0" aria-label="Move Email"></span>
        <input class="form-input sx-sort-field" type="text" value="Email address" aria-label="Field label">
    </div>
    <div class="sx-sort-item" data-id="phone">
        <span class="sx-sort-grip" data-icon="grip-vertical" tabindex="0" aria-label="Move Phone"></span>
        <input class="form-input sx-sort-field" type="text" value="Phone number" aria-label="Field label">
    </div>
    <div class="sx-sort-item" data-id="message">
        <span class="sx-sort-grip" data-icon="grip-vertical" tabindex="0" aria-label="Move Message"></span>
        <input class="form-input sx-sort-field" type="text" value="Message" aria-label="Field label">
    </div>
</div>
