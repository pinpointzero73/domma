<div class="flex gap-8 flex-wrap items-start">
    <div class="demo-target-label" style="padding-top: 0.5rem;">
        <button type="button" id="js-demo-target" class="btn btn-outline btn-lg">
            <span data-icon="bell"></span>
        </button>
        <span class="demo-label">Target element</span>
    </div>
    <div style="flex: 1; min-width: 220px;">
        <div class="flex items-center gap-3 mb-4">
            <span class="text-gray-600 text-sm">Count:</span>
            <span id="js-count-display" class="live-count-display">0</span>
        </div>
        <div class="flex gap-2 flex-wrap mb-3">
            <button type="button" id="js-decrement" class="btn btn-sm btn-outline">− Decrement</button>
            <button type="button" id="js-increment" class="btn btn-sm btn-primary">+ Increment</button>
            <button type="button" id="js-add-5" class="btn btn-sm btn-outline">+5</button>
            <button type="button" id="js-reset" class="btn btn-sm btn-outline-danger">Reset to 0</button>
        </div>
        <div class="flex gap-2 flex-wrap mb-3">
            <button type="button" id="js-dot-toggle" class="btn btn-sm btn-outline">Enable Dot</button>
            <button type="button" id="js-pulse-toggle" class="btn btn-sm btn-outline">Enable Pulse</button>
        </div>
        <div class="flex gap-2 flex-wrap items-center">
            <span class="text-gray-600 text-sm">Variant:</span>
            <button type="button" class="btn btn-sm btn-outline variant-btn" data-variant="primary">Primary</button>
            <button type="button" class="btn btn-sm btn-outline variant-btn" data-variant="success">Success</button>
            <button type="button" class="btn btn-sm btn-outline variant-btn" data-variant="danger">Danger</button>
            <button type="button" class="btn btn-sm btn-outline variant-btn" data-variant="warning">Warning</button>
            <button type="button" class="btn btn-sm btn-outline variant-btn" data-variant="info">Info</button>
        </div>
    </div>
</div>
