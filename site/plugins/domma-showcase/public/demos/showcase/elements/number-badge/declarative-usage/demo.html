<div class="demo-counters-row">
    <div class="demo-target-label">
        <domma-number-badge count="5">
            <button type="button" class="btn btn-outline"><span data-icon="bell"></span></button>
        </domma-number-badge>
        <span class="demo-label">Default (danger)</span>
    </div>
    <div class="demo-target-label">
        <domma-number-badge count="3" variant="primary">
            <button type="button" class="btn btn-outline"><span data-icon="mail"></span></button>
        </domma-number-badge>
        <span class="demo-label">Primary</span>
    </div>
    <div class="demo-target-label">
        <domma-number-badge count="0" variant="success">
            <button type="button" class="btn btn-outline"><span data-icon="check"></span></button>
        </domma-number-badge>
        <span class="demo-label">Count = 0 (hidden)</span>
    </div>
    <div class="demo-target-label">
        <domma-number-badge dot="" variant="success">
            <div class="demo-avatar">AB</div>
        </domma-number-badge>
        <span class="demo-label">Dot mode</span>
    </div>
    <div class="demo-target-label">
        <domma-number-badge count="7" pulse="" variant="warning">
            <button type="button" class="btn btn-outline"><span data-icon="bell"></span></button>
        </domma-number-badge>
        <span class="demo-label">Pulsing</span>
    </div>
</div>
