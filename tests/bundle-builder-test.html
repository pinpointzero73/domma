<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundle Builder Integration Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .test-results {
            margin-top: 20px;
        }

        .test {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .test.pass {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .test.fail {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .test.running {
            background: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }

        .test-details {
            font-size: 0.9em;
            margin-top: 5px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<h1>Bundle Builder Integration Test</h1>
<p>Testing bundle builder functionality...</p>

<div id="results" class="test-results"></div>

<script>
    const results = document.getElementById('results');

    function addTest(name, status, details = '') {
        const div = document.createElement('div');
        div.className = `test ${status}`;
        div.innerHTML = `
                <strong>${name}</strong>: ${status.toUpperCase()}
                ${details ? `<div class="test-details">${details}</div>` : ''}
            `;
        results.appendChild(div);
    }

    async function runTests() {
        // Test 1: Load metadata
        try {
            addTest('Test 1: Load metadata', 'running', 'Fetching bundle-metadata.json...');
            const response = await fetch('../public/dist/bundle-metadata.json');
            const data = await response.json();

            if (data.modules && data.presets) {
                const moduleCount = Object.keys(data.modules).length;
                const presetCount = Object.keys(data.presets).length;
                results.lastChild.remove();
                addTest('Test 1: Load metadata', 'pass',
                    `Found ${moduleCount} modules and ${presetCount} presets`);
            } else {
                results.lastChild.remove();
                addTest('Test 1: Load metadata', 'fail', 'Invalid metadata structure');
            }
        } catch (error) {
            results.lastChild.remove();
            addTest('Test 1: Load metadata', 'fail', `Error: ${error.message}`);
        }

        // Test 2: Verify preset bundles exist
        try {
            addTest('Test 2: Verify preset bundles', 'running', 'Checking bundle files...');
            const bundles = ['minimal', 'essentials', 'data-focused', 'no-ui'];
            const results_temp = await Promise.all(
                bundles.map(async name => {
                    const response = await fetch(`../public/dist/domma-${name}.min.js`, {method: 'HEAD'});
                    return {name, exists: response.ok};
                })
            );

            const allExist = results_temp.every(r => r.exists);
            const foundBundles = results_temp.filter(r => r.exists).map(r => r.name);

            results.lastChild.remove();
            if (allExist) {
                addTest('Test 2: Verify preset bundles', 'pass',
                    `All bundles found: ${foundBundles.join(', ')}`);
            } else {
                const missing = results_temp.filter(r => !r.exists).map(r => r.name);
                addTest('Test 2: Verify preset bundles', 'fail',
                    `Missing bundles: ${missing.join(', ')}`);
            }
        } catch (error) {
            results.lastChild.remove();
            addTest('Test 2: Verify preset bundles', 'fail', `Error: ${error.message}`);
        }

        // Test 3: Verify build-info includes bundle sizes
        try {
            addTest('Test 3: Verify build-info', 'running', 'Checking build-info.json...');
            const response = await fetch('../public/dist/build-info.json');
            const data = await response.json();

            if (data.bundles && typeof data.bundles === 'object') {
                const bundleNames = Object.keys(data.bundles);
                const bundleSizes = bundleNames.map(name =>
                    `${name}: ${data.bundles[name].sizeFormatted}`
                ).join(', ');

                results.lastChild.remove();
                addTest('Test 3: Verify build-info', 'pass',
                    `Bundle sizes tracked: ${bundleSizes}`);
            } else {
                results.lastChild.remove();
                addTest('Test 3: Verify build-info', 'fail',
                    'build-info.json missing bundles object');
            }
        } catch (error) {
            results.lastChild.remove();
            addTest('Test 3: Verify build-info', 'fail', `Error: ${error.message}`);
        }

        // Test 4: Verify bundle entry points were generated
        try {
            addTest('Test 4: Verify generated entry points', 'running', 'Checking src/bundles/...');
            const entryPoints = ['minimal', 'essentials', 'data-focused', 'no-ui'];
            const results_temp = await Promise.all(
                entryPoints.map(async name => {
                    const response = await fetch(`../src/bundles/${name}.js`, {method: 'HEAD'});
                    return {name, exists: response.ok};
                })
            );

            const allExist = results_temp.every(r => r.exists);
            const found = results_temp.filter(r => r.exists).map(r => r.name);

            results.lastChild.remove();
            if (allExist) {
                addTest('Test 4: Verify generated entry points', 'pass',
                    `All entry points generated: ${found.join('.js, ') + '.js'}`);
            } else {
                const missing = results_temp.filter(r => !r.exists).map(r => r.name);
                addTest('Test 4: Verify generated entry points', 'fail',
                    `Missing entry points: ${missing.join(', ')}`);
            }
        } catch (error) {
            results.lastChild.remove();
            addTest('Test 4: Verify generated entry points', 'fail', `Error: ${error.message}`);
        }

        // Final summary
        const passCount = document.querySelectorAll('.test.pass').length;
        const failCount = document.querySelectorAll('.test.fail').length;
        const total = passCount + failCount;

        const summary = document.createElement('div');
        summary.style.marginTop = '20px';
        summary.style.padding = '15px';
        summary.style.borderRadius = '4px';
        summary.style.fontWeight = 'bold';

        if (failCount === 0) {
            summary.style.background = '#d4edda';
            summary.style.color = '#155724';
            summary.textContent = `✓ All ${total} tests passed!`;
        } else {
            summary.style.background = '#f8d7da';
            summary.style.color = '#721c24';
            summary.textContent = `✗ ${failCount} of ${total} tests failed`;
        }

        results.appendChild(summary);
    }

    // Run tests when page loads
    runTests();
</script>
</body>
</html>
