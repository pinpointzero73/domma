name: CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # domma-celebrate is consumed as `file:../domma-celebrate`, and npm cannot
      # supply it - the package is unpublished and the npm account is suspended.
      # The GitHub repository is public, so clone and build it into the sibling
      # path the link already points at. Its dist/ is gitignored, hence the
      # build: `copy:celebrate` copies that tree, and without it every
      # celebration 404s on the day it matters.
      - name: Fetch and build domma-celebrate
        run: |
          git clone --depth 1 https://github.com/pinpointzero73/domma-celebrate.git ../domma-celebrate
          npm --prefix ../domma-celebrate ci
          npm --prefix ../domma-celebrate run build

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "public/dist" ]; then
            echo "Error: public/dist directory not created"
            exit 1
          fi
          echo "Build successful! Generated files:"
          ls -lh public/dist/*.js public/dist/*.css 2>/dev/null || true

      - name: Upload build artifacts
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: domma-dist
          path: public/dist/
          retention-days: 7
