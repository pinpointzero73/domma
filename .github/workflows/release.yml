name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # domma-celebrate is consumed as `file:../domma-celebrate`, and npm cannot
      # supply it - the package is unpublished and the npm account is suspended.
      # The GitHub repository is public, so clone and build it into the sibling
      # path the link already points at. Its dist/ is gitignored, hence the
      # build: `copy:celebrate` copies that tree, and without it every
      # celebration 404s on the day it matters.
      - name: Fetch and build domma-celebrate
        run: |
          git clone --depth 1 https://github.com/pinpointzero73/domma-celebrate.git ../domma-celebrate
          npm --prefix ../domma-celebrate ci
          npm --prefix ../domma-celebrate run build

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Create distribution archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd public/dist

          # Create main archive with all files
          tar -czf "domma-${TAG_NAME}.tar.gz" *.js *.css themes/ bundles/ archives/ || true

          # Create minified-only archive
          tar -czf "domma-${TAG_NAME}-min.tar.gz" *.min.js *.css themes/ || true

      - name: Create Release
        env:
          TAG_NAME: ${{ github.ref_name }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            public/dist/domma-${{ github.ref_name }}.tar.gz
            public/dist/domma-${{ github.ref_name }}-min.tar.gz
            public/dist/domma.min.js
            public/dist/domma.esm.js
            public/dist/domma.css
            public/dist/grid.css
            public/dist/elements.css
          generate_release_notes: true
          draft: false
          prerelease: false
