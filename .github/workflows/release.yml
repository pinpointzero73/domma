name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Create distribution archives
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd public/dist

          # Create main archive with all files
          tar -czf "domma-${TAG_NAME}.tar.gz" *.js *.css themes/ bundles/ archives/ || true

          # Create minified-only archive
          tar -czf "domma-${TAG_NAME}-min.tar.gz" *.min.js *.css themes/ || true

      - name: Create Release
        env:
          TAG_NAME: ${{ github.ref_name }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            public/dist/domma-${{ github.ref_name }}.tar.gz
            public/dist/domma-${{ github.ref_name }}-min.tar.gz
            public/dist/domma.min.js
            public/dist/domma.esm.js
            public/dist/domma.css
            public/dist/grid.css
            public/dist/elements.css
          generate_release_notes: true
          draft: false
          prerelease: false
